<!doctype html>
<html><head><meta charset="utf-8">
<title>Metro City</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff}
#hud{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;pointer-events:none}
#hud b{color:#ffd23f}
#msg{position:fixed;top:30%;width:100%;text-align:center;font-size:26px;font-weight:700;text-shadow:0 2px 6px #000;pointer-events:none;transition:opacity .4s}
#map{position:fixed;right:12px;bottom:12px;border:2px solid #fff;border-radius:50%;background:#222}
#help{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;font-size:12px;pointer-events:none}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);font-size:22px;cursor:pointer;text-align:center}
#touch{display:none}
.touch #touch{display:block}.touch #help{display:none}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}
.tb{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:700;font-size:13px;touch-action:none;right:calc(var(--r) + env(safe-area-inset-right,0px));bottom:calc(var(--b) + env(safe-area-inset-bottom,0px))}
.touch #map{width:120px;height:120px;top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
</style></head><body>
<div id="hud"></div><div id="msg"></div><canvas id="map" width="180" height="180"></canvas>
<div id="help">WASD move/drive · Mouse look · E enter/exit car · Space handbrake · Shift sprint · T taxi job · Click/F shoot · B car dealer · Crimes bring police!</div>
<div id="touch"><div id="joy"><div id="knob"></div></div>
<button class="tb" id="bE" style="--r:24px;--b:110px">E</button><button class="tb" id="bB" style="--r:100px;--b:30px">BRAKE</button>
<button class="tb" id="bF" style="--r:24px;--b:190px;background:rgba(160,0,0,.6)">SHOOT</button><button class="tb" id="bT" style="--r:24px;--b:30px">TAXI</button><button class="tb" id="bR" style="--r:100px;--b:110px">RUN</button></div>
<div id="cross" style="position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 3px #000"></div>
<div id="near" hidden style="position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffd23f;color:#111;font-weight:800;padding:12px 18px;border-radius:30px;cursor:pointer;box-shadow:0 4px 12px #0008">AUTO DEALER · press B / tap</div>
<div id="shop" hidden style="position:fixed;inset:0;background:rgba(8,10,14,.88);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))">
<div style="max-width:720px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0;font-size:28px">Metro Motors</h2><button id="shopX" style="font-size:16px;padding:8px 16px;border-radius:20px;border:0;background:#fff;color:#111;font-weight:700">Close</button></div>
<p id="shopMoney" style="color:#ffd23f;font-weight:700"></p><div id="shopList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div></div></div>
<div id="start"><div><div style="font-size:48px;font-weight:800">METRO CITY</div>Click or tap to play</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var N=8, RW=16, BLOCK=60, CELL=BLOCK+RW, HALF=N*CELL/2, LANE=3.5;
function roadPos(i){return i*CELL-HALF;}
var rnd=Math.random, clamp=function(v,a,b){return v<a?a:v>b?b:v;};

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x9fc4e8,80,420);
var camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1200);
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

var hemi=new THREE.HemisphereLight(0xcfe6ff,0x4a4a40,0.6); scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff1d6,1.2); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); var sc=sun.shadow.camera; sc.left=sc.bottom=-90; sc.right=sc.top=90; sc.far=500; sun.shadow.bias=-0.0005;
scene.add(sun); scene.add(sun.target);

// ---------- textures ----------
function canvasTex(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
function noise(g,w,h,base,amt){g.fillStyle=base;g.fillRect(0,0,w,h);for(var i=0;i<w*h/6;i++){var v=(rnd()*amt)|0;g.fillStyle='rgba('+(rnd()<.5?'0,0,0':'255,255,255')+','+(v/255)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2);}}
var asphalt=canvasTex(256,256,function(g,w,h){noise(g,w,h,'#3a3b3d',40);}); asphalt.repeat.set(N*CELL/8,N*CELL/8);
var concrete=canvasTex(128,128,function(g,w,h){noise(g,w,h,'#9a9890',30);g.strokeStyle='rgba(0,0,0,.25)';g.strokeRect(0,0,w,h);});
var grass=canvasTex(128,128,function(g,w,h){noise(g,w,h,'#4f7a35',50);}); grass.repeat.set(10,10);
// facade styles: 8x8 bays, each bay 4m x 3.5m
function facade(wall,win,frame){
  var lit=[];var map=canvasTex(512,512,function(g){g.fillStyle=wall;g.fillRect(0,0,512,512);
    for(var y=0;y<8;y++)for(var x=0;x<8;x++){g.fillStyle=frame;g.fillRect(x*64+8,y*64+12,48,40);g.fillStyle=win;g.fillRect(x*64+11,y*64+15,42,34);lit.push(rnd()<.35);}});
  var em=canvasTex(512,512,function(g){g.fillStyle='#000';g.fillRect(0,0,512,512);
    for(var i=0;i<64;i++)if(lit[i]){var x=i%8,y=(i/8)|0;g.fillStyle=['#ffd890','#fff2c8','#bfe0ff'][(rnd()*3)|0];g.fillRect(x*64+11,y*64+15,42,34);}});
  map.encoding=THREE.sRGBEncoding;
  return new THREE.MeshStandardMaterial({map:map,emissiveMap:em,emissive:0xffffff,emissiveIntensity:0,roughness:.75,metalness:.05});
}
var facades=[facade('#7b3f2e','#22303a','#d8cfc0'),facade('#b9b3a6','#2b3d4c','#555'),facade('#2c4a63','#5b87a8','#1c2c3a'),facade('#d9d2c2','#324250','#8a8070'),facade('#444a50','#7fa3bf','#2a2e33')];
facades[2].metalness=.6;facades[2].roughness=.25;facades[4].metalness=.5;facades[4].roughness=.3;
var roofMat=new THREE.MeshStandardMaterial({color:0x3b3b3b,roughness:.9});

// ---------- ground & roads ----------
var ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshStandardMaterial({map:grass,roughness:1}));
grass.repeat.set(300,300); ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; ground.receiveShadow=true; scene.add(ground);
var road=new THREE.Mesh(new THREE.PlaneGeometry(N*CELL+RW,N*CELL+RW),new THREE.MeshStandardMaterial({map:asphalt,roughness:.95}));
road.rotation.x=-Math.PI/2; road.receiveShadow=true; scene.add(road);
var yellow=new THREE.MeshBasicMaterial({color:0xe8c33a}), white=new THREE.MeshBasicMaterial({color:0xeeeeee});
var dummy=new THREE.Object3D();
function instanced(geo,mat,list,shadow){var m=new THREE.InstancedMesh(geo,mat,list.length);list.forEach(function(f,i){dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);f(dummy);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);});m.castShadow=!!shadow;m.receiveShadow=true;scene.add(m);return m;}
// center lines & crosswalks
var lines=[],stripes=[];
for(var i=0;i<=N;i++)for(var k=0;k<N;k++){(function(i,k){var mid=roadPos(k)+CELL/2;
  lines.push(function(d){d.position.set(roadPos(i),0.02,mid);d.rotation.x=-Math.PI/2;d.scale.set(1,BLOCK-6,1);});
  lines.push(function(d){d.position.set(mid,0.02,roadPos(i));d.rotation.x=-Math.PI/2;d.rotation.z=Math.PI/2;d.scale.set(1,BLOCK-6,1);});})(i,k);}
instanced(new THREE.PlaneGeometry(0.35,1),yellow,lines);
for(var i=0;i<=N;i++)for(var j=0;j<=N;j++)for(var s=-6;s<=6;s+=2){(function(x,z,s){
  [[x+s,z+RW/2+1.5,0],[x+s,z-RW/2-1.5,0],[x+RW/2+1.5,z+s,1],[x-RW/2-1.5,z+s,1]].forEach(function(p){stripes.push(function(d){d.position.set(p[0],0.02,p[1]);d.rotation.x=-Math.PI/2;if(p[2])d.rotation.z=Math.PI/2;});});})(roadPos(i),roadPos(j),s);}
instanced(new THREE.PlaneGeometry(1,3),white,stripes);

// ---------- blocks, buildings, parks ----------
var rects={}; // collision rects per block key
function bkey(x,z){return Math.floor((x+HALF)/CELL)+','+Math.floor((z+HALF)/CELL);}
function addRect(x0,x1,z0,z1){var k=bkey((x0+x1)/2,(z0+z1)/2);(rects[k]=rects[k]||[]).push([x0,x1,z0,z1]);}
var walkMat=new THREE.MeshStandardMaterial({map:concrete,roughness:.9});
var trees=[],lamps=[],blocks=[];
var bgeo=new THREE.BoxGeometry(1,1,1);
function building(x,z,w,d,h){
  var g=new THREE.BoxGeometry(w,h,d), uv=g.attributes.uv;
  var dims=[[d,h],[d,h],[0,0],[0,0],[w,h],[w,h]];
  for(var f=0;f<6;f++)for(var v=0;v<4;v++){var n=f*4+v;uv.setXY(n,uv.getX(n)*dims[f][0]/32,uv.getY(n)*dims[f][1]/28);}
  var mat=facades[(rnd()*facades.length)|0];
  var m=new THREE.Mesh(g,[mat,mat,roofMat,roofMat,mat,mat]); m.position.set(x,h/2+0.25,z); m.castShadow=m.receiveShadow=true; scene.add(m);
  if(h>40&&rnd()<.5){var a=new THREE.Mesh(bgeo,roofMat);a.scale.set(w*.4,4,d*.4);a.position.set(x,h+2.25,z);scene.add(a);}
  addRect(x-w/2,x+w/2,z-d/2,z+d/2);
}
for(var bi=0;bi<N;bi++)for(var bj=0;bj<N;bj++){
  var x0=roadPos(bi)+RW/2, z0=roadPos(bj)+RW/2, cx=x0+BLOCK/2, cz=z0+BLOCK/2;
  blocks.push([x0,z0]);
  var curb=new THREE.Mesh(bgeo,walkMat); curb.scale.set(BLOCK,0.25,BLOCK); curb.position.set(cx,0.125,cz); curb.receiveShadow=true; scene.add(curb);
  var dist=Math.hypot(cx,cz)/HALF, park=rnd()<0.1&&dist>.3;
  if(park){var p=new THREE.Mesh(new THREE.PlaneGeometry(BLOCK-8,BLOCK-8),new THREE.MeshStandardMaterial({map:grass,roughness:1}));p.rotation.x=-Math.PI/2;p.position.set(cx,0.26,cz);p.receiveShadow=true;scene.add(p);
    for(var t=0;t<14;t++)(function(x,z,s){trees.push(function(d){d.position.set(x,0,z);d.scale.set(s,s,s);});})(cx+(rnd()-.5)*44,cz+(rnd()-.5)*44,.8+rnd()*.6);
  } else {
    var tall=Math.max(0.15,1-dist), lots=rnd()<.4?1:2;
    for(var a=0;a<lots;a++)for(var b=0;b<lots;b++){
      var sz=(BLOCK-8)/lots, w=sz-2-rnd()*4, d=sz-2-rnd()*4;
      var h=lots==1? 30+rnd()*120*tall : 8+rnd()*(20+70*tall*tall);
      building(x0+4+sz*(a+.5),z0+4+sz*(b+.5),w,d,Math.round(h/3.5)*3.5);
    }
  }
  // sidewalk trees + streetlamps
  for(var s=8;s<BLOCK;s+=17){(function(s){
    [[x0+s,z0+1.5],[x0+s,z0+BLOCK-1.5],[x0+1.5,z0+s],[x0+BLOCK-1.5,z0+s]].forEach(function(p,ix){
      if((s/17|0)%2) trees.push(function(d){d.position.set(p[0],0.25,p[1]);d.scale.set(.7,.7,.7);});
      else lamps.push([p[0],p[1],ix]);});})(s);}
}
instanced(new THREE.CylinderGeometry(.2,.3,3,6).translate(0,1.5,0),new THREE.MeshStandardMaterial({color:0x5a3d24}),trees,true);
instanced(new THREE.IcosahedronGeometry(2.2,1).translate(0,4.3,0),new THREE.MeshStandardMaterial({color:0x3f6b2a,roughness:.9,flatShading:true}),trees,true);
instanced(new THREE.CylinderGeometry(.1,.14,7,6).translate(0,3.5,0),new THREE.MeshStandardMaterial({color:0x333333,metalness:.6,roughness:.4}),lamps.map(function(p){return function(d){d.position.set(p[0],.25,p[1]);};}),true);
var bulbMat=new THREE.MeshStandardMaterial({color:0x222222,emissive:0xffd28a,emissiveIntensity:0});
instanced(new THREE.BoxGeometry(.6,.25,.6),bulbMat,lamps.map(function(p){return function(d){d.position.set(p[0],7.3,p[1]);};}));

// ---------- traffic lights ----------
var lights={};
var lampGeo=new THREE.SphereGeometry(.28,8,6), poleGeo=new THREE.CylinderGeometry(.12,.12,5,6).translate(0,2.5,0), poleMat=new THREE.MeshStandardMaterial({color:0x222222});
function phase(i,j){return (clock+(i*3+j*5))%20;}
function green(axis,i,j){var p=phase(i,j);return axis==='x'?(p<8?'g':p<10?'y':'r'):(p>=10&&p<18?'g':p>=18?'y':'r');}
for(var i=0;i<=N;i++)for(var j=0;j<=N;j++){var x=roadPos(i)+RW/2+.5,z=roadPos(j)+RW/2+.5;
  var pole=new THREE.Mesh(poleGeo,poleMat);pole.position.set(x,.25,z);pole.castShadow=true;scene.add(pole);
  var mx=new THREE.MeshBasicMaterial({color:0}),mz=new THREE.MeshBasicMaterial({color:0});
  var lx=new THREE.Mesh(lampGeo,mx);lx.position.set(x-.4,5,z);scene.add(lx);var lz=new THREE.Mesh(lampGeo,mz);lz.position.set(x,5,z-.4);scene.add(lz);
  lights[i+','+j]={i:i,j:j,mx:mx,mz:mz};}
var LC={g:0x22ff55,y:0xffc400,r:0xff2222};

// ---------- cars ----------
var carColors=[0xb01e1e,0x1e4fb0,0xeeeeee,0x111111,0x8a8f96,0x2e7d32,0xf2c200,0x5d3a9b].map(function(c){return new THREE.MeshStandardMaterial({color:c,metalness:.6,roughness:.35});});
var glass=new THREE.MeshStandardMaterial({color:0x10161c,metalness:.9,roughness:.1}), tire=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
var headM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff4d0,emissiveIntensity:.3}), tailM=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1a1a,emissiveIntensity:.4});
// side profiles [z,y] (front = +z): lower body, cabin. W width, wr wheel radius, wb half wheelbase
var CARS={
  hatch:{name:'City Hatch',price:800,top:34,acc:7,W:1.75,wr:.31,wb:1.25,low:[[-1.95,.3],[1.95,.3],[2,.55],[1.9,.75],[.9,.88],[-1.85,.95],[-2,.8]],cab:[[.85,.88],[-1.85,.95],[-1.75,1.45],[-.05,1.45]]},
  sedan:{name:'Family Sedan',price:2500,top:42,acc:9,W:1.85,wr:.33,wb:1.4,low:[[-2.3,.32],[2.3,.32],[2.33,.6],[2.2,.78],[1.05,.92],[-1.35,.95],[-2.25,.88],[-2.33,.65]],cab:[[1.0,.92],[-1.3,.95],[-.95,1.42],[.25,1.42]]},
  suv:{name:'Trail SUV',price:5000,top:40,acc:8.5,W:1.95,wr:.4,wb:1.45,low:[[-2.4,.45],[2.4,.45],[2.42,.85],[2.3,1.05],[1.25,1.15],[-2.3,1.15],[-2.42,.95]],cab:[[1.2,1.15],[-2.3,1.15],[-2.25,1.85],[.3,1.85]]},
  pickup:{name:'Work Pickup',price:4000,top:38,acc:8,W:1.95,wr:.42,wb:1.7,low:[[-2.7,.48],[2.7,.48],[2.72,.85],[2.6,1.05],[1.4,1.15],[-2.7,1.15],[-2.72,.95]],cab:[[1.35,1.15],[-.4,1.15],[-.35,1.85],[.55,1.85]]},
  sports:{name:'GT Coupe',price:12000,top:58,acc:13,W:1.9,wr:.34,wb:1.35,low:[[-2.2,.28],[2.25,.28],[2.3,.45],[2.15,.6],[.9,.78],[-1.3,.82],[-2.2,.78],[-2.25,.55]],cab:[[.85,.78],[-1.25,.82],[-.7,1.18],[0,1.18]]},
  hyper:{name:'Vortex Hyper',price:30000,top:75,acc:17,W:2.0,wr:.36,wb:1.4,low:[[-2.3,.25],[2.35,.25],[2.4,.38],[2.2,.5],[.7,.72],[-1.6,.82],[-2.3,.8],[-2.35,.5]],cab:[[.65,.72],[-1.5,.82],[-.9,1.12],[-.15,1.12]]}};
var CAR_TYPES=Object.keys(CARS);
function extrude(pts,depth,bevel){var sh=new THREE.Shape();pts.forEach(function(p,i){i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]);});
  var g=new THREE.ExtrudeGeometry(sh,{depth:depth-bevel*2,bevelEnabled:bevel>0,bevelSize:bevel,bevelThickness:bevel,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-(depth-bevel*2)/2);g.rotateY(Math.PI/2);return g;} // shape x->world z
var tireGeo=new THREE.CylinderGeometry(1,1,.26,18).rotateZ(Math.PI/2),rimGeo=new THREE.CylinderGeometry(.62,.62,.28,10).rotateZ(Math.PI/2);
var rimM=new THREE.MeshStandardMaterial({color:0xc8ccd2,metalness:.9,roughness:.25}),trimM=new THREE.MeshStandardMaterial({color:0x151515,roughness:.6});
var carGeoCache={};
function carGeos(t){if(carGeoCache[t])return carGeoCache[t];var c=CARS[t];
  var cabCenter=function(k,sx){var cz=0,cy=0;c.cab.forEach(function(p){cz+=p[0];cy+=p[1];});cz/=4;cy/=4;return c.cab.map(function(p){return[cz+(p[0]-cz)*k,cy+(p[1]-cy)*sx];});};
  return carGeoCache[t]={low:extrude(c.low,c.W,.06),cab:extrude(c.cab,c.W*.86,.04),glass:extrude(cabCenter(.9,.78),c.W*.88,0),wind:extrude(cabCenter(.97,.85),c.W*.8,0)};}
function makeCar(mat,taxi,type){
  type=type||CAR_TYPES[(rnd()*4)|0];var c=CARS[type],G2=carGeos(type),g=new THREE.Group();
  var lowY=Math.min.apply(null,c.low.map(function(p){return p[1];}));
  [ [G2.low,mat],[G2.cab,mat],[G2.glass,glass],[G2.wind,glass] ].forEach(function(e){var m=new THREE.Mesh(e[0],e[1]);m.castShadow=true;g.add(m);});
  var front=c.low[1][0],back=c.low[0][0],roofY=Math.max.apply(null,c.cab.map(function(p){return p[1];}));
  [-1,1].forEach(function(sx){[c.wb,-c.wb].forEach(function(z){var w=new THREE.Group();w.position.set(sx*(c.W/2-.12),c.wr,z);
      var t=new THREE.Mesh(tireGeo,tire);t.scale.set(1,c.wr,c.wr);var r=new THREE.Mesh(rimGeo,rimM);r.scale.set(1,c.wr,c.wr);w.add(t,r);g.add(w);});
    var h=new THREE.Mesh(bgeo,headM);h.scale.set(.42,.13,.08);h.position.set(sx*c.W*.32,lowY+.3,front+.02);
    var tl=new THREE.Mesh(bgeo,tailM);tl.scale.set(.45,.13,.08);tl.position.set(sx*c.W*.33,lowY+.38,back-.02);
    var mir=new THREE.Mesh(bgeo,mat);mir.scale.set(.18,.1,.12);mir.position.set(sx*(c.W/2+.06),c.cab[0][1]+.12,c.cab[0][0]-.15);g.add(h,tl,mir);});
  var bump=new THREE.Mesh(bgeo,trimM);bump.scale.set(c.W*.96,.16,.12);bump.position.set(0,lowY+.08,front+.02);
  var bump2=bump.clone();bump2.position.z=back-.02;var grill=new THREE.Mesh(bgeo,trimM);grill.scale.set(c.W*.4,.14,.05);grill.position.set(0,lowY+.3,front+.04);g.add(bump,bump2,grill);
  if(taxi){var s=new THREE.Mesh(bgeo,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffd23f,emissiveIntensity:.6}));s.scale.set(.7,.22,.3);s.position.set(0,roofY+.13,(c.cab[2][0]+c.cab[3][0])/2);g.add(s);}
  g.spec=c;g.type=type;g.roofY=roofY;g.roofZ=(c.cab[2][0]+c.cab[3][0])/2;scene.add(g);return g;
}
var traffic=[];
function spawnTraffic(){
  var axis=rnd()<.5?'x':'z', r=(rnd()*(N+1))|0, dir=rnd()<.5?1:-1, s=(rnd()-.5)*N*CELL*.95;
  var c={mesh:makeCar(carColors[(rnd()*carColors.length)|0]),axis:axis,road:r,dir:dir,s:s,v:8,max:11+rnd()*5};
  c.next=nextK(c); place(c,true); traffic.push(c);
}
function nextK(c){var f=(c.s+HALF)/CELL;return c.dir>0?Math.floor(f+1e-3)+1:Math.ceil(f-1e-3)-1;}
var tmpV=new THREE.Vector3();
function carTarget(c,out){var rp=roadPos(c.road);
  if(c.axis==='x')out.set(c.s,0,rp+c.dir*LANE);else out.set(rp-c.dir*LANE,0,c.s);return out;}
function place(c,snap){carTarget(c,tmpV);var ang=c.axis==='x'?(c.dir>0?Math.PI/2:-Math.PI/2):(c.dir>0?0:Math.PI);
  if(snap){c.mesh.position.copy(tmpV);c.mesh.rotation.y=ang;return;}
  c.mesh.position.lerp(tmpV,.15);var d=ang-c.mesh.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));c.mesh.rotation.y+=d*.12;}
for(var i=0;i<70;i++)spawnTraffic();

function updateTraffic(dt){
  for(var n=0;n<traffic.length;n++){var c=traffic[n];
    if(c.next<0||c.next>N){c.dir=-c.dir;c.next=nextK(c);}
    var inter=roadPos(c.next), dist=(inter-c.s)*c.dir, target=c.max;
    var li=c.axis==='x'?[c.next,c.road]:[c.road,c.next], st=green(c.axis,li[0],li[1]), stopAt=RW/2+3;
    if(st!=='g'&&dist>stopAt-1&&dist<stopAt+22&&!(st==='y'&&dist<stopAt+5))target=Math.min(target,Math.max(0,(dist-stopAt)*.8));
    for(var m=0;m<traffic.length;m++){var o=traffic[m];if(o===c||o.axis!==c.axis||o.road!==c.road||o.dir!==c.dir)continue;
      var gap=(o.s-c.s)*c.dir;if(gap>0&&gap<14)target=Math.min(target,Math.max(0,(gap-7)*1.2));}
    // avoid player
    var fx=c.mesh.position.x+Math.sin(c.mesh.rotation.y)*5,fz=c.mesh.position.z+Math.cos(c.mesh.rotation.y)*5;
    if(Math.hypot(fx-P.pos.x,fz-P.pos.z)<4.5)target=0;
    c.v+=clamp(target-c.v,-14*dt,5*dt); c.s+=c.v*c.dir*dt;
    if(dist<=0){ // at intersection
      var turn=rnd(), atEdge=c.next===0||c.next===N;
      if(turn<.35||(atEdge&&turn<.7)){var newRoad=c.next, cross=c.axis==='x'?c.mesh.position.x:c.mesh.position.z;
        var ns=c.axis==='x'?c.mesh.position.z:c.mesh.position.x;
        c.axis=c.axis==='x'?'z':'x';c.road=newRoad;c.s=ns;
        c.dir=c.road===0?1:c.road===N?-1:(c.road===c.road&&rnd()<.5?1:-1);
        if((c.s+HALF)<5)c.dir=1;if(c.s>HALF-5)c.dir=-1;}
      c.next=nextK(c);}
    place(c,false);
  }
}

function collide(pos,r){var k=bkey(pos.x,pos.z).split(','),hit=false;
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){var L=rects[(+k[0]+a)+','+(+k[1]+b)];if(!L)continue;
    L.forEach(function(R){var cx=clamp(pos.x,R[0],R[1]),cz=clamp(pos.z,R[2],R[3]),dx=pos.x-cx,dz=pos.z-cz,d=Math.hypot(dx,dz);
      if(d<r){hit=true;if(d<1e-4){dx=0;dz=1;d=1;}pos.x=cx+dx/d*r;pos.z=cz+dz/d*r;}});}
  var lim=HALF+RW/2+40;pos.x=clamp(pos.x,-lim,lim);pos.z=clamp(pos.z,-lim,lim);return hit;}
function updatePlayer(dt){

    var sp=c.mesh.spec;if(f>0)c.v+=(c.v<0?20:sp.acc*(1-Math.max(0,c.v)/sp.top*.6))*dt;else if(f<0)c.v-=(c.v>0?20:6)*dt;else c.v*=1-.6*dt;

    if(mv.lengthSq()){mv.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),P.yaw).multiplyScalar((keys.ShiftLeft?9:4)*dt);P.pos.add(mv);avatar.rotation.y=Math.atan2(-mv.x,-mv.z)+Math.PI;avatar.ph=(avatar.ph||0)+dt*(keys.ShiftLeft?14:9);}

function updatePolice(dt){
  if(wanted>0){var near=police.some(function(c){return !c.dead&&c.mesh.position.distanceTo(P.pos)<70;});
    calmT=near?0:calmT+dt;if(calmT>12){wanted=Math.max(0,Math.floor(wanted)-1);calmT=0;say(wanted?'Losing them...':'You lost the cops!');}}
  var want=Math.min(5,Math.ceil(wanted)+(wanted>=3?1:0));copSpawnT-=dt;
  if(police.filter(function(c){return !c.dead;}).length<want&&copSpawnT<=0){spawnCop();copSpawnT=3;}
  if(wanted<=0)for(var i=police.length-1;i>=0;i--)if(police[i].mesh.position.distanceTo(P.pos)>90){scene.remove(police[i].mesh);police.splice(i,1);}
  var flash=Math.sin(clock*14)>0;redL.color.setHex(flash?0xff0000:0x330000);blueL.color.setHex(flash?0x001133:0x0050ff);
  var close=false;
  police.forEach(function(c){if(c.dead)return;var p=c.mesh.position,tx=P.pos.x,tz=P.pos.z;
    if(wanted>0&&p.distanceTo(P.pos)>25){ // follow road grid toward player
      var rx=roadPos(nearestRoad(p.x)),rz=roadPos(nearestRoad(p.z)),onX=Math.abs(p.z-rz)<RW/2,onZ=Math.abs(p.x-rx)<RW/2;
      var px=roadPos(nearestRoad(tx)),pz=roadPos(nearestRoad(tz));
      if(onX&&(!onZ||Math.abs(tx-p.x)>Math.abs(tz-p.z))){tx=Math.abs(px-p.x)<4?px:px;tz=rz;if(Math.abs(px-p.x)<6){tx=px;tz=tz+(P.pos.z>p.z?20:-20);}}
      else if(onZ){tz=pz;tx=rx;if(Math.abs(pz-p.z)<6){tz=pz;tx=tx+(P.pos.x>p.x?20:-20);}}}
    var maxV=wanted>0?(P.car?Math.max(30,Math.abs(P.car.v)+3):12):0;
    var want=Math.atan2(tx-p.x,tz-p.z),d=want-c.h;d=Math.atan2(Math.sin(d),Math.cos(d));
    if(c.rev>0){c.rev-=dt;c.v=-6;c.h-=d*dt;}else{c.h+=clamp(d,-1,1)*dt*2.4;c.v+=(Math.abs(d)>1.2?maxV*.4:maxV)>c.v?14*dt:-20*dt;}
    p.x+=Math.sin(c.h)*c.v*dt;p.z+=Math.cos(c.h)*c.v*dt;
    if(collide(p,2.2)){c.stuck+=dt;if(c.stuck>.6){c.rev=.8;c.stuck=0;}}else c.stuck=Math.max(0,c.stuck-dt);
    police.forEach(function(o){if(o===c)return;var dx=p.x-o.mesh.position.x,dz=p.z-o.mesh.position.z,dd=Math.hypot(dx,dz);if(dd<4&&dd>0){p.x+=dx/dd*(4-dd)*.5;p.z+=dz/dd*(4-dd)*.5;}});
    c.mesh.rotation.y=c.h;
    if(wanted>0&&p.distanceTo(P.pos)<6&&(!P.car||Math.abs(P.car.v)<4))close=true;});
  bustT=close?bustT+dt:Math.max(0,bustT-dt*2);
  if(bustT>3){var fine=Math.round(Math.max(0,P.money)*.3)+100;P.money-=fine;say('BUSTED! Fined $'+fine);wanted=0;bustT=0;
    if(P.car)toggleCar();P.pos.set(roadPos(4)+RW/2+2,.25,roadPos(4)+RW/2+10);police.forEach(function(c){scene.remove(c.mesh);});police.length=0;}
}

// ---------- guns ----------
var health=100,shotCD=0,ray=new THREE.Ray(),tracerGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
var tracer=new THREE.Line(tracerGeo,new THREE.LineBasicMaterial({color:0xffee88}));tracer.visible=false;scene.add(tracer);var tracerT=0;
var flashL=new THREE.PointLight(0xffaa44,0,12);scene.add(flashL);
var boom=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),new THREE.MeshBasicMaterial({color:0xff7a1a,transparent:true}));boom.visible=false;scene.add(boom);var boomT=0;
var cp=new THREE.Vector3(),hitP=new THREE.Vector3();
function shoot(){if(shotCD>0)return;shotCD=.18;
  camera.getWorldDirection(ray.direction);ray.origin.copy(camera.position);
  var best=null,bt=150;
  police.forEach(function(c){if(c.dead)return;cp.copy(c.mesh.position);cp.y=1;var t=ray.direction.dot(cp.clone().sub(ray.origin));if(t>0&&t<bt&&ray.distanceSqToPoint(cp)<5){bt=t;best=c;}});
  peds.forEach(function(p){cp.copy(p.m.position);cp.y+=1.1;var t=ray.direction.dot(cp.clone().sub(ray.origin));if(t>0&&t<bt&&ray.distanceSqToPoint(cp)<.5){bt=t;best=p;}});
  ray.at(bt,hitP);var from=P.pos.clone();from.y+=P.car?1.5:1.3;
  tracerGeo.setFromPoints([from,hitP]);tracer.visible=true;tracerT=.06;flashL.position.copy(from);flashL.intensity=3;
  if(!best){addWanted(.05);return;}
  if(best.cop){best.hp=(best.hp||4)-1;addWanted(.25);
    if(best.hp<=0){best.dead=true;best.v=0;best.deadT=0;best.mesh.traverse(function(o){if(o.isMesh&&o!==best.r&&o!==best.b)o.material=burnt;});
      boom.position.copy(best.mesh.position);boom.visible=true;boomT=0;say('Police car destroyed!');addWanted(1);P.money+=0;}}
  else{say('Pedestrian down!');addWanted(1);best.b=blocks[(rnd()*blocks.length)|0];best.t=rnd()*4;}
}
var burnt=new THREE.MeshStandardMaterial({color:0x151515,roughness:1});
function updateGuns(dt){shotCD-=dt;if(tracerT>0){tracerT-=dt;if(tracerT<=0){tracer.visible=false;flashL.intensity=0;}}
  if(boom.visible){boomT+=dt;boom.scale.setScalar(1+boomT*14);boom.material.opacity=Math.max(0,1-boomT*1.5);if(boomT>.7)boom.visible=false;}
  for(var i=police.length-1;i>=0;i--){var c=police[i];if(c.dead){c.deadT+=dt;if(c.deadT>8){scene.remove(c.mesh);police.splice(i,1);}}}
  // cops shoot back at 3+ stars
  if(wanted>=3)police.forEach(function(c){if(!c.dead&&c.mesh.position.distanceTo(P.pos)<35&&rnd()<dt*1.5){health-=P.car?4:8;say('You are being shot!');}});
  else health=Math.min(100,health+dt*3);
  if(health<=0){health=100;var fine=Math.round(Math.max(0,P.money)*.3)+100;P.money-=fine;say('WASTED! Hospital bill $'+fine);wanted=0;
    if(P.car)toggleCar();P.pos.set(roadPos(4)+RW/2+2,.25,roadPos(4)+RW/2+10);police.forEach(function(c){scene.remove(c.mesh);});police.length=0;}
}

// ---------- car dealer ----------
var DX=roadPos(4)+RW/2+1.5,DZ=roadPos(4)+RW/2+32,owned={sedan:true};
var pad=new THREE.Mesh(new THREE.CircleGeometry(3,32),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.5}));pad.rotation.x=-Math.PI/2;pad.position.set(DX,.27,DZ);scene.add(pad);
var signTex=canvasTex(512,128,function(g){g.fillStyle='#111';g.fillRect(0,0,512,128);g.fillStyle='#ffd23f';g.font='bold 64px system-ui';g.textAlign='center';g.fillText('METRO MOTORS',256,86);});
var sign=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:signTex}));sign.position.set(DX+.2,7,DZ);sign.rotation.y=-Math.PI/2;scene.add(sign);
var sp1=new THREE.Mesh(poleGeo,poleMat);sp1.position.set(DX+.3,.25,DZ-4);var sp2=sp1.clone();sp2.position.z=DZ+4;scene.add(sp1,sp2);
var nearEl=document.getElementById('near'),shopEl=document.getElementById('shop'),listEl=document.getElementById('shopList');
nearEl.onclick=openShop;document.getElementById('shopX').onclick=function(){shopEl.hidden=true;};
function nearDealer(){return Math.hypot(P.pos.x-DX,P.pos.z-DZ)<6;}
function openShop(){if(!nearDealer())return;if(document.pointerLockElement)document.exitPointerLock();shopEl.hidden=false;renderShop();}
function renderShop(){document.getElementById('shopMoney').textContent='Cash: $'+P.money;listEl.innerHTML='';
  CAR_TYPES.forEach(function(t){var c=CARS[t],d=document.createElement('div');
    d.style.cssText='background:#1b2029;border:1px solid #333a48;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px';
    d.innerHTML='<b style="font-size:18px">'+c.name+'</b><span style="color:#aab">Top speed '+Math.round(c.top*3.6)+' km/h · 0-100 in '+(27.8/c.acc*1.6).toFixed(1)+'s</span>';
    var b=document.createElement('button');b.style.cssText='margin-top:6px;padding:10px;border-radius:8px;border:0;font-weight:800;font-size:15px';
    b.textContent=(owned[t]?'Spawn (owned)':'Buy $'+c.price.toLocaleString());b.style.background=owned[t]?'#3fbf5a':P.money>=c.price?'#ffd23f':'#555';b.style.color='#111';
    b.onclick=function(){if(!owned[t]){if(P.money<c.price){b.textContent='Need $'+(c.price-P.money);return;}P.money-=c.price;owned[t]=true;}
      spawnOwned(t);shopEl.hidden=true;say(c.name+' is waiting by the curb!');};
    d.appendChild(b);listEl.appendChild(d);});}
var colorPick=0;
function spawnOwned(t){var m=makeCar(carColors[(colorPick++)%carColors.length],false,t);m.position.set(roadPos(4)+RW/2-1.4,0,DZ+12);m.rotation.y=0;parked.push({mesh:m,v:0,h:0,mine:true});}
function updateDealer(){nearEl.hidden=!nearDealer()||!shopEl.hidden||!!P.car;}

// ---------- day/night ----------
var clock=0, tod=9, sky=new THREE.Color(), dayC=new THREE.Color(0x9fc4e8), duskC=new THREE.Color(0xf08a5a), nightC=new THREE.Color(0x0a1022);
function updateSky(dt){tod=(tod+dt*24/600)%24; // 10 min per day
  var a=(tod-6)/12*Math.PI, sy=Math.sin(a), day=clamp(sy*3,0,1), dusk=clamp(1-Math.abs(sy)*4,0,1)*(sy>-0.2?1:0);
  sun.position.set(P.pos.x+Math.cos(a)*150,Math.max(sy,0.05)*200,P.pos.z+60);sun.target.position.copy(P.pos);
  sun.intensity=day*1.3;hemi.intensity=.12+day*.5;
  sky.copy(nightC).lerp(dayC,day).lerp(duskC,dusk*.6);scene.background=sky;scene.fog.color.copy(sky);
  var night=1-day;facades.forEach(function(m){m.emissiveIntensity=night*1.2;});bulbMat.emissiveIntensity=night*3;headM.emissiveIntensity=.3+night*2;}

// ---------- loop ----------
var hud=document.getElementById('hud'),last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  updateSky(dt);updateTraffic(dt);updatePeds(dt);updatePlayer(dt);updateJob(dt);updatePolice(dt);updateGuns(dt);updateDealer();
  for(var k in lights){var L=lights[k];L.mx.color.setHex(LC[green('x',L.i,L.j)]);L.mz.color.setHex(LC[green('z',L.i,L.j)]);}
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0;}
  var hh=Math.floor(tod),mm=Math.floor((tod-hh)*60);
  hud.innerHTML='<b>$'+P.money+'</b> &nbsp;❤ '+Math.ceil(health)+'<br>Time '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+'<br>'+(P.car?'Speed '+Math.round(Math.abs(P.car.v)*3.6)+' km/h':'On foot')+(wanted>=1?'<br><span style="color:#ff5050;font-size:20px">'+'★'.repeat(Math.floor(wanted))+'</span>'+(bustT>0?' <b>BUSTED IN '+Math.ceil(3-bustT)+'</b>':''):'')+(job?'<br>Taxi: '+(job.stage?'drop off':'pick up'):'');
  drawMap();renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body></html>
