<title>Gridiron U</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Oswald:wght@500;700&display=swap">
<style>
/* One full-screen canvas (field or broadcast booth) + DOM overlays: TV score bug, ticker, menus. Single night-stadium look. */
:root{
  --ink:#f4f1ff; --night:#0b1020; --panel:#141a33ee; --gold:#ffc83d; --flag:#ffd400; --red:#e8434b; --grass:#2f8f3a; --dim:#9aa3c7;
  --pixel:'Press Start 2P',monospace; --tv:'Oswald','Arial Narrow',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--tv);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;overflow-y:auto;touch-action:pan-y;background:#0b1020f2;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov>*{max-width:520px;width:100%}
h1{font-family:var(--pixel);font-size:clamp(26px,8vw,42px);color:var(--gold);text-align:center;margin:18px 0 4px;text-shadow:0 4px 0 var(--red);line-height:1.2}
h2{font-family:var(--pixel);font-size:15px;color:var(--gold);margin:6px 0;text-align:center;line-height:1.5}
p,.small{color:var(--dim);font-size:15px;margin:0;line-height:1.4}
button{font-family:var(--pixel);font-size:12px;border:0;border-radius:6px;padding:14px 12px;min-height:44px;background:var(--gold);color:#1a1300;box-shadow:0 4px 0 #a07800;cursor:pointer;touch-action:manipulation;line-height:1.4}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a07800}
button.alt{background:#2b355f;color:var(--ink);box-shadow:0 4px 0 #111833}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1b2246;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:15px}
.row b{color:var(--gold);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid #ffffff14}
th{color:var(--dim);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;font-size:10px;padding:10px 4px}
.tabs button.on{background:var(--red);color:#fff;box-shadow:0 4px 0 #8a1f25}

/* ---- TV score bug (three fictional network packages) ---- */
#bug{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;height:44px;font-family:var(--tv);pointer-events:none;filter:drop-shadow(0 3px 6px #000a)}
#bug .net{display:grid;place-items:center;padding:0 8px;font-weight:700;font-size:13px;letter-spacing:.04em}
#bug .tm{display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0;flex:1 1 0;position:relative}
#bug .tm .rk{font-size:11px;opacity:.8}
#bug .tm .ab{font-size:19px;font-weight:700;letter-spacing:.03em}
#bug .tm .rec{font-size:10px;opacity:.75}
@media (max-width:440px){#bug .tm .rec,#bug .tm .rk{display:none}#bug .net{padding:0 5px;font-size:11px}#bug .tm{padding:0 4px}#bug .tm .sc{font-size:21px;padding:0 2px}#bug .clk{min-width:56px;padding:0 4px}#bug .dd{min-width:62px;font-size:12px;padding:0 4px}}
#bug .tm .sc{margin-left:auto;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
#bug .tm .to{position:absolute;bottom:3px;left:8px;display:flex;gap:3px}
#bug .tm .to i{width:10px;height:3px;background:#fff}
#bug .tm .to i.u{opacity:.2}
#bug .tm.pos::after{content:'';position:absolute;right:2px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--gold);transform:translateY(-50%)}
#bug .clk{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px;font-variant-numeric:tabular-nums;min-width:74px}
#bug .clk .q{font-size:12px;font-weight:700}
#bug .clk .t{font-size:18px;font-weight:700}
#bug .dd{display:grid;place-items:center;padding:0 8px;font-size:13px;font-weight:700;min-width:84px;text-align:center;line-height:1.1}
#bug .dd.flag{background:var(--flag)!important;color:#000!important;animation:fl .5s steps(2) infinite}
@keyframes fl{50%{opacity:.6}}
/* GBS: sleek dark glass */
#bug.gbs .net{background:#0d1b3d;color:#fff}
#bug.gbs .tm{color:#fff}
#bug.gbs .clk,#bug.gbs .dd{background:#111;color:#fff}
/* Vulcan: chunky boxes, bold red frame */
#bug.vul{border:3px solid #c8102e;border-radius:4px;background:#000}
#bug.vul .net{background:#c8102e;color:#fff;font-style:italic}
#bug.vul .tm{color:#fff;border-right:3px solid #000}
#bug.vul .clk{background:#fff;color:#000}#bug.vul .dd{background:#222;color:#ffd400}
/* SCN: royal blue and gold */
#bug.scn{border-top:3px solid #d4a017}
#bug.scn .net{background:#0a2a6b;color:#d4a017}
#bug.scn .tm{color:#fff}
#bug.scn .clk{background:#0a2a6b;color:#fff}#bug.scn .dd{background:#d4a017;color:#0a2a6b}
#ticker{position:absolute;left:0;right:0;bottom:0;height:calc(26px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#000c;overflow:hidden;white-space:nowrap;font-size:13px;line-height:26px;pointer-events:none}
#ticker span{display:inline-block;padding-left:100%;animation:tk 40s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
#cap{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));background:#000b;border-left:4px solid var(--gold);padding:8px 10px;font-size:15px;line-height:1.3;border-radius:4px;pointer-events:none}
#cap b{color:var(--gold);font-weight:700;margin-right:6px}
#ctl{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 max(12px,env(safe-area-inset-left,0px))}
#ctl button{font-size:10px;padding:10px 10px}
#ctl button.on{background:var(--red);color:#fff;box-shadow:0 4px 0 #8a1f25}
#mute{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));font-size:10px;padding:8px;min-height:36px}
@media (prefers-reduced-motion:reduce){#ticker span{animation-duration:120s}#bug .dd.flag{animation:none}}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cap" hidden></div>
  <div id="ctl" hidden></div>
  <div id="bug" class="gbs" hidden></div>
  <div id="ticker" hidden><span id="tkx"></span></div>
  <button id="mute" class="alt" hidden>VOICE ON</button>
  <div class="ov" id="ov"></div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= Fictional league =================
const TEAMS=[
 ['Ironridge','Lumberjacks','IRN','#2e6b3a','#f0e6c8','Heartland'],['Prairie State','Bison','PSU','#7a2e1f','#e9c46a','Heartland'],
 ['Granite Falls','Rams','GFR','#3b4a6b','#d9d9d9','Heartland'],['Northpine','Wolves','NPW','#1f3b2d','#c0c0c0','Heartland'],
 ['Copper Valley','Miners','CVM','#b5651d','#222222','Heartland'],['Ashford','Owls','ASH','#4b2c6b','#f5d76e','Heartland'],
 ['Thunder Basin','Bolts','TBB','#ffcc00','#1b1b1b','Heartland'],['Highland A&M','Highlanders','HAM','#8b0000','#ffffff','Heartland'],
 ['Coral Bay','Mariners','CBM','#0077b6','#ffb703','Coastal'],['Silverlake','Herons','SLH','#5f8fa8','#ffffff','Coastal'],
 ['Redmesa','Coyotes','RMC','#c1440e','#2b2b2b','Coastal'],['Saltmarsh','Pelicans','SMP','#14532d','#f4a261','Coastal'],
 ['Kingsport','Monarchs','KPM','#5b2a86','#ffd166','Coastal'],['Bayou Tech','Crawdads','BYT','#a4161a','#f1faee','Coastal'],
 ['Crestview','Comets','CRV','#023e8a','#ff6b6b','Coastal'],['Sunridge','Stallions','SRS','#e76f51','#264653','Coastal']
].map((t,i)=>({id:i,school:t[0],mascot:t[1],ab:t[2],c1:t[3],c2:t[4],conf:t[5],ovr:RI(62,88),w:0,l:0,cw:0,cl:0,pts:0}));
const NETS=[{k:'gbs',n:'GBS',full:'GBS Sports'},{k:'vul',n:'VULCAN',full:'Vulcan Sports'},{k:'scn',n:'SCN',full:'Southern Collegiate Network'}];
const CREW=[{name:'Chip Mallory',role:'Play-by-play',skin:'#e0ac69',hair:'#3b2a1a',suit:'#1d3557',tie:'#e63946'},
            {name:'Vern Tuckett',role:'Analyst',skin:'#8d5524',hair:'#111',suit:'#4a4e69',tie:'#ffd166'}];
const FIRST=['Jalen','Cole','Marcus','Tyler','Dre','Brock','Isaiah','Caden','Malik','Jace','Trey','Bo','Elijah','Rashad','Kyler','Devin','Mason','Zeke','Quinn','Tavion'];
const LAST=['Hollis','Barrow','Kincaid','Merritt','Okafor','Pruitt','Dunlap','Strand','Vance','Whitlock','Tolliver','Ames','Crowder','Fontaine','Raines','Sutter','Mabry','Oakes','Lyle','Banks'];
const YRS=['FR','SO','JR','SR'];
const POS=['QB','RB','WR','WR','TE','K'];
function mkPlayer(pos,stars,yr){return{name:pick(FIRST)+' '+pick(LAST),pos,stars:stars||RI(2,4),yr:yr??RI(0,3),gpa:+R(2.3,3.8).toFixed(1),xp:0}}

// ================= Save =================
const KEY='gridironU_v1';
let S=null;
function newSave(teamId){
  const t=TEAMS[teamId];
  return{team:teamId,season:1,week:0,credits:6,net:'gbs',voice:true,prestige:50,
    roster:POS.map(p=>mkPlayer(p,p==='QB'?3:RI(2,3))),oline:2,def:2,fac:{train:1,acad:1,stadium:1},
    teams:TEAMS.map(x=>({ovr:x.ovr})),sched:null,results:[],trophies:[],ranks:null,recruits:null}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,league:TEAMS.map(t=>[t.ovr,t.w,t.l,t.cw,t.cl,t.pts])}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||!d.S)return false;S=d.S;d.league.forEach((a,i)=>{const t=TEAMS[i];[t.ovr,t.w,t.l,t.cw,t.cl,t.pts]=a});return true}catch(e){return false}}
const ME=()=>TEAMS[S.team];
const P=pos=>S.roster.filter(p=>p.pos===pos).sort((a,b)=>b.stars-a.stars).find(p=>p.gpa>=2.0)||S.roster.find(p=>p.pos===pos)||mkPlayer(pos,1);
function teamOvr(){let s=0;S.roster.forEach(p=>s+=p.stars*(p.gpa>=2?1:.4));return Math.round(52+s*1.2+S.oline*3+S.def*3+S.fac.train*2)}

function makeSchedule(){
  const me=ME(), conf=TEAMS.filter(t=>t.conf===me.conf&&t!==me), non=TEAMS.filter(t=>t.conf!==me.conf);
  const opp=[...conf].sort(()=>Math.random()-.5).concat([...non].sort(()=>Math.random()-.5).slice(0,4)).sort(()=>Math.random()-.5);
  S.sched=opp.map((t,i)=>({opp:t.id,home:i%2===0}));
}
function rankings(){return [...TEAMS].sort((a,b)=>(b.w-b.l)*10+b.ovr/10+b.pts/200-((a.w-a.l)*10+a.ovr/10+a.pts/200))}
function rankOf(t){const r=rankings().indexOf(t);return r<10?r+1:0}

// ================= Audio + voice =================
let AC=null;
function beep(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function whistle(){beep(2400,.35,'sine',.06);setTimeout(()=>beep(2600,.25,'sine',.05),120)}
function crowd(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*1.2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)*.25;const s=AC.createBufferSource(),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;s.buffer=b;s.connect(f).connect(AC.destination);s.start()}catch(e){}}
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
let talking=-1;
function say(who,text){
  return new Promise(res=>{
    const cap=$('cap');cap.hidden=false;cap.innerHTML='<b>'+esc(CREW[who].name.split(' ')[1].toUpperCase())+'</b>'+esc(text);
    talking=who;let done=false;const fin=()=>{if(done)return;done=true;talking=-1;res()};
    const ms=Math.max(1600,text.length*62);
    if(S&&S.voice&&window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(text);if(voices.length)u.voice=voices[who%voices.length]||voices[0];u.pitch=who?.8:1.1;u.rate=1.08;u.onend=()=>setTimeout(fin,250);u.onerror=()=>setTimeout(fin,ms);speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(fin,ms+5000)}catch(e){setTimeout(fin,ms)}}
    else setTimeout(fin,ms);
  });
}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
async function talk(lines){for(const [w,t] of lines){if(skipTalk)break;await say(w,t)}skipTalk=false;$('cap').hidden=true}
let skipTalk=false;

// ================= Overlay menus =================
const ov=$('ov');
function show(html){ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0}
function hideOv(){ov.hidden=true}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;beep(660,.06);const fn=ACT[b.dataset.a];if(fn)fn(b.dataset.v)});
const ACT={};

function titleScreen(){
  mode='title';
  const has=load();
  show(`<h1>GRIDIRON U</h1><p style="text-align:center">College football dynasty. Call plays, throw dimes, recruit, keep grades up and chase the Championship.</p>
  ${has?`<button data-a="cont">CONTINUE · ${esc(ME().school)} · YR ${S.season}</button>`:''}
  <button data-a="pickTeam" class="${has?'alt':''}">NEW DYNASTY</button>
  <p class="small" style="text-align:center">All schools, conferences, broadcasters and announcers are fictional.</p>`);
}
ACT.cont=()=>hub();
ACT.pickTeam=()=>{
  show(`<h2>PICK YOUR SCHOOL</h2><p>Lower-rated schools are a tougher rebuild.</p><div class="grid2">${TEAMS.map(t=>`<button class="alt" data-a="newTeam" data-v="${t.id}" style="text-align:left;font-size:10px"><span class="sw" style="background:${t.c1};outline:2px solid ${t.c2}"></span>${esc(t.school)}<br><span style="color:var(--dim)">${t.mascot} · ${t.ovr}</span></button>`).join('')}</div>`);
};
ACT.newTeam=v=>{S=newSave(+v);TEAMS.forEach(t=>{t.w=t.l=t.cw=t.cl=t.pts=0});makeSchedule();rollRecruits();save();hub()};

let tab='home';
function hub(){
  mode='hub';hush();['bug','ticker','ctl','cap','mute'].forEach(i=>$(i).hidden=true);
  const me=ME(), wk=S.week, g=S.sched[wk], o=g?TEAMS[g.opp]:null, rk=rankOf(me);
  const tabs=['home','roster','recruit','school','league'].map(t=>`<button data-a="tab" data-v="${t}" class="${tab===t?'on':'alt'}">${t.toUpperCase()}</button>`).join('');
  let body='';
  if(tab==='home'){
    body=`<div class="card"><div class="row"><span><span class="sw" style="background:${me.c1}"></span><b>${rk?'#'+rk+' ':''}${esc(me.school)} ${esc(me.mascot)}</b></span><span>${me.w}-${me.l}</span></div>
    <div class="row"><span>Season ${S.season} · Week ${Math.min(wk+1,12)}</span><span>OVR <b>${teamOvr()}</b></span></div>
    <div class="row"><span>Coaching credits</span><b>${S.credits}</b></div><div class="row"><span>Prestige</span><b>${S.prestige}</b></div><div class="row"><span>Golden Helmet race (QB ${esc(P('QB').name)})</span><b>${S.hs?S.hs.td+' TD · '+S.hs.yd+' yds':'—'}</b></div></div>`;
    if(o)body+=`<div class="card"><h2>NEXT: ${g.home?'vs':'@'} ${rankOf(o)?'#'+rankOf(o)+' ':''}${esc(o.school.toUpperCase())}</h2><div class="row"><span>${esc(o.mascot)} · ${o.conf}</span><span>${o.w}-${o.l} · OVR ${o.ovr}</span></div>
      <div class="row"><span>Broadcast</span><span>${NETS.map(n=>`<button data-a="net" data-v="${n.k}" class="${S.net===n.k?'':'alt'}" style="font-size:9px;padding:8px 6px">${n.n}</button>`).join(' ')}</span></div>
      <button data-a="play">KICKOFF ▶</button></div>`;
    else body+=`<div class="card"><h2>REGULAR SEASON OVER</h2><button data-a="post">POSTSEASON ▶</button></div>`;
    body+=`<div class="card"><div class="row"><span>Voice commentary</span><button class="alt" data-a="voice" style="font-size:10px;padding:8px">${S.voice?'ON':'OFF'}</button></div></div>`;
    body+=`<table><tr><th>Wk</th><th>Opponent</th><th>Result</th></tr>${S.sched.map((s,i)=>`<tr><td>${i+1}</td><td>${s.home?'vs':'@'} ${esc(TEAMS[s.opp].school)}</td><td>${S.results[i]||'—'}</td></tr>`).join('')}</table>`;
  }else if(tab==='roster'){
    body=`<p>Players under a 2.0 GPA are academically ineligible and play at 40%. Seniors graduate after the season.</p><table><tr><th>Pos</th><th>Name</th><th>Yr</th><th>★</th><th>GPA</th><th></th></tr>${S.roster.map((p,i)=>`<tr><td>${p.pos}</td><td>${esc(p.name)}</td><td>${YRS[p.yr]}</td><td style="color:var(--gold)">${'★'.repeat(p.stars)}</td><td style="color:${p.gpa<2?'var(--red)':'inherit'}">${p.gpa.toFixed(1)}</td><td><button class="alt" data-a="train" data-v="${i}" style="font-size:9px;padding:6px" ${S.credits<2||p.stars>=5?'disabled':''}>+★ 2c</button></td></tr>`).join('')}</table>
    <div class="grid2"><button class="alt" data-a="unit" data-v="oline" ${S.credits<3||S.oline>=5?'disabled':''}>O-LINE ${S.oline}/5 · 3c</button><button class="alt" data-a="unit" data-v="def" ${S.credits<3||S.def>=5?'disabled':''}>DEFENSE ${S.def}/5 · 3c</button></div>
    <button class="alt" data-a="study" ${S.credits<1?'disabled':''}>STUDY HALL · 1c (+0.3 GPA all)</button>`;
  }else if(tab==='recruit'){
    body=`<p>Sign high-school recruits with credits. Roster max 10. A signed player replaces nobody — cut a player to make room.</p><table><tr><th>Pos</th><th>Recruit</th><th>★</th><th>GPA</th><th></th></tr>${S.recruits.map((p,i)=>`<tr><td>${p.pos}</td><td>${esc(p.name)}</td><td style="color:var(--gold)">${'★'.repeat(p.stars)}</td><td>${p.gpa.toFixed(1)}</td><td><button data-a="sign" data-v="${i}" style="font-size:9px;padding:6px" ${S.credits<p.stars||S.roster.length>=10?'disabled':''}>${p.stars}c</button></td></tr>`).join('')}</table>
    <h2>CUT A PLAYER</h2><div class="tabs">${S.roster.map((p,i)=>`<button class="alt" data-a="cut" data-v="${i}" style="font-size:9px">${p.pos} ${esc(p.name.split(' ')[1])}</button>`).join('')}</div>`;
  }else if(tab==='school'){
    const f=S.fac;body=`<p>Facilities boost your program. Upgrades cost 4 credits per level.</p>${[['train','Training center','Players play better'],['acad','Academic center','GPAs rise every week'],['stadium','Stadium','More credits per home win']].map(([k,n,d])=>`<div class="card"><div class="row"><b>${n}</b><span>Lv ${f[k]}/5</span></div><p>${d}</p><button class="alt" data-a="fac" data-v="${k}" ${S.credits<4||f[k]>=5?'disabled':''}>UPGRADE · 4c</button></div>`).join('')}

function setupFormation(){
  const L=G.los, call=plays[callIdx], wr1=P('WR'),te=P('TE'),rb=P('RB'),qb=P('QB');

    RUN:[[[10,L],[10,L+8]],[[43,L],[43,L+8]],[[34,L],[34,L+4]]],TOSS:[[[10,L],[10,L+8]],[[43,L],[43,L+8]],[[34,L],[38,L+3]]]}[call];

    {r:'WR',p:wr1,x:routes[0][0][0],y:L,sp:sp(wr1.stars),route:routes[0].slice(1)},{r:'WR',p:wr2,x:routes[1][0][0],y:L,sp:sp(wr2.stars),route:routes[1].slice(1)},{r:'TE',p:te,x:routes[2][0][0],y:L,sp:sp(te.stars)-.4,route:routes[2].slice(1)}];
  for(let i=0;i<4;i++)off.push({r:'OL',x:21+i*3.5+1.7,y:L-.8,sp:3,ol:true});

  const def=[];
  off.filter(o=>o.route||o.r==='RB').forEach(o=>def.push({x:o.x+R(-1,1),y:L+R(5,8),sp:dsp+R(-.4,.4),man:o,d:true}));
  def.push({x:26,y:L+16,sp:dsp+.3,safety:true,d:true});
  for(let i=0;i<3;i++)def.push({x:22+i*4.5,y:L+1.2,sp:3.6+G.opp.ovr/60-S.oline*.12,rush:true,d:true,delay:R(.4,.9)+S.oline*.25});
  off.forEach(o=>{o.vx=o.vy=0;o.ri=0});

function snap(){
  if(!G.play)return;beep(300,.08);$('ctl').hidden=true;
  // pre-snap penalties
  if(Math.random()<.06){const f=pick([['FALSE START','OFFENSE',-5,false],['OFFSIDE','DEFENSE',5,false],['ENCROACHMENT','DEFENSE',5,false]]);return penalty(...f)}
  G.play.state='live';
  if(G.play.call==='TOSS'){const rb=G.play.off[1];rb.x=36;rb.y-=1;G.play.carrier=rb;G.play.state='run';G.play.delayRush=1}
  if(G.play.call==='PA BOMB'){G.play.def.filter(d=>d.rush).forEach(d=>d.delay+=.6);G.play.def.filter(d=>d.man).forEach(d=>d.y-=2)}
  if(G.play.call==='RUN'){const rb=G.play.off[1];G.play.carrier=rb;G.play.state='run';rb.vy=1}
}
function penalty(name,on,yds,auto1st){

  const team=on==='OFFENSE'?ME():G.opp;
  msgSet('FLAG: '+name);flagAnim={t:0,x:G.los};

    await say(0,`Flag on the play. ${name}, ${team.mascot}. ${Math.abs(yds)} yards.`);
    if(Math.random()<.5)await say(1,on==='OFFENSE'?`You can't do that. That's a drive killer right there.`:`Gift for the ${ME().mascot}. They'll take the free yardage.`);
    $('cap').hidden=true;
    G.los=clamp(G.los+yds,1,99);G.togo=Math.max(1,G.togo-yds);if(auto1st||G.togo<=0){G.down=1;G.togo=10}
    G.flag=false;preSnap();
  },900);
}
let flagAnim=null;

function stepPlay(dt){
  const pl=G.play;if(!pl||pl.state==='pre'||pl.state==='dead')return;
  pl.t+=dt;G.clock-=dt*1.3;
  const qb=pl.qb;
  // offense routes
  pl.off.forEach(o=>{
    if(o===pl.carrier)return;
    if(o.ol){const r=pl.def.filter(d=>d.rush).sort((a,b)=>Math.hypot(a.x-o.x,a.y-o.y)-Math.hypot(b.x-o.x,b.y-o.y))[0];if(r){o.x+=(r.x-o.x)*dt*1.5;o.y+=((r.y-1)-o.y)*dt*1.5}return}
    if(o.r==='QB'){if(pl.state==='live'&&!pl.ball)o.y=Math.max(o.y-dt*2,pl.startLos-7);return}
    if(pl.carrier&&!pl.ball){/* block downfield */const d=pl.def[0];return}
    if(o.route&&o.ri<o.route.length){const [tx,ty]=o.route[o.ri],dx=tx-o.x,dy=ty-o.y,dd=Math.hypot(dx,dy);if(dd<.5)o.ri++;else{o.x+=dx/dd*o.sp*dt;o.y+=dy/dd*o.sp*dt}}
    else if(o.route){o.y+=o.sp*dt*.7}
  });
  // carrier control: steer toward finger
  const c=pl.carrier;
  if(c&&!pl.ball){
    let tx=c.x,ty=c.y+10;
    if(touch){const w=toWorld(touch.x,touch.y);tx=w.x;ty=Math.max(w.y,c.y+1)}
    const dx=tx-c.x,dy=ty-c.y,dd=Math.hypot(dx,dy)||1;c.x=clamp(c.x+dx/dd*c.sp*dt,.5,52.8);c.y+=dy/dd*c.sp*dt;
    if(c.x<=.6||c.x>=52.7){endPlay('out')}
    if(c.y>=100)return endPlay('td');
  }
  // defense
  pl.def.forEach(d=>{
    let tx,ty;
    if(c&&!pl.ball){tx=c.x;ty=c.y+.3}
    else if(d.rush){if(pl.t<d.delay)return;tx=qb.x;ty=qb.y}
    else if(pl.ball){tx=pl.ball.tx;ty=pl.ball.ty}
    else if(d.man){tx=d.man.x+.8;ty=d.man.y+1.5}
    else{tx=26;ty=pl.startLos+14}
    const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy);if(dd>.05){const s=d.sp*(c?1.02:.97);d.x+=dx/dd*Math.min(s*dt,dd);d.y+=dy/dd*Math.min(s*dt,dd)}
    if(c&&!pl.ball&&dd<.9&&pl.state!=='dead'){
      const brk=(c.p?c.p.stars:2)*.05;if(!d.missed&&Math.random()<brk){d.missed=true;d.sp*=.5;msgSet('BROKEN TACKLE!');crowd()}else if(!d.missed)endPlay(c===qb&&!pl.thrown&&pl.call!=='RUN'&&pl.call!=='TOSS'?'sack':'tackle')}
  });

  const me=ME(),op=G.opp;boothT+=dt;ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){ctx.fillStyle=[me.c1,op.c1,'#ddd','#444'][i%4];const x=(i*53)%W,y=(i*29)%(H*.35)+20+Math.sin(boothT*6+i)*2;ctx.fillRect(x,y,4,5)}
  ctx.fillStyle='#2f8f3a';ctx.beginPath();ctx.moveTo(W*.1,H*.42);ctx.lineTo(W*.9,H*.42);ctx.lineTo(W,H*.85);ctx.lineTo(0,H*.85);ctx.fill();
  for(let i=0;i<=10;i++){ctx.strokeStyle='#fff7';ctx.beginPath();ctx.moveTo(W*.1+W*.08*i,H*.42);ctx.lineTo(W*.1*i,H*.85);ctx.stroke()}
  for(let i=0;i<11;i++){ctx.fillStyle=op.c1;ctx.fillRect(W*.3+i*W*.04+Math.sin(boothT*2+i)*6,H*.6,6,10);ctx.fillStyle=me.c1;ctx.fillRect(W*.3+i*W*.04+Math.cos(boothT*2+i)*6,H*.56,6,10)}
  ctx.fillStyle='#fff';ctx.font='bold 14px Oswald,sans-serif';ctx.textAlign='center';ctx.fillText(`${op.mascot.toUpperCase()} BALL · YOUR DEFENSE IS ON THE FIELD`,W/2,H*.9);ctx.textAlign='left';
  if(oppFlag>0){oppFlag-=dt;G.flag=true;ctx.fillStyle='#ffd400';ctx.save();ctx.translate(W*.5+Math.sin(boothT*5)*30,H*.5-oppFlag*30);ctx.rotate(boothT*6);ctx.fillRect(-8,-8,16,16);ctx.restore();if(oppFlag<=0){G.flag=false;renderBug()}}
}
function drawKick(dt){
  drawField(0);kick.t+=dt;const v=Math.sin(kick.t*2.4),zone=.18+P('K').stars*.03-kick.dist/400;
  const bw=Math.min(W*.8,320),bx=(W-bw)/2,by=H*.4;ctx.fillStyle='#000b';ctx.fillRect(bx-6,by-30,bw+12,60);ctx.fillStyle='#e8434b';ctx.fillRect(bx,by,bw,16);ctx.fillStyle='#3fd06b';ctx.fillRect(bx+bw/2-bw/2*zone,by,bw*zone,16);
  ctx.fillStyle='#fff';ctx.fillRect(bx+bw/2+v*bw/2-2,by-6,4,28);ctx.font='bold 13px Oswald,sans-serif';ctx.textAlign='center';ctx.fillText(`${kick.dist} YARD ATTEMPT · TAP KICK IN THE GREEN`,W/2,by-12);ctx.textAlign='left';
}

// ================= Loop =================
let last=performance.now(), bugT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    if(mode==='field'){stepPlay(dt);drawField(dt);bugT+=dt;if(bugT>.5){bugT=0;renderBug()}if(G.play&&G.play.state!=='dead'&&G.clock<=0&&G.play.state==='pre'){}}
    else if(mode==='booth')drawBooth(dt);
    else if(mode==='opp')drawOpp(dt);
    else if(mode==='kick')drawKick(dt);
    else{ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H)}
  }catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
titleScreen();
})();
</script>
