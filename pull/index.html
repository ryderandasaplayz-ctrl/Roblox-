<title>Full Pull</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --dirt: #7a4d2a; --dirt-dk: #3b2414; --dirt-lt: #a0703f;
  --diesel: #17140f; --diesel-2: #221d16; --diesel-3: #2f281f;
  --flame: #ff6a1a; --flame-2: #ff3b1a; --fair: #ffd23f; --sky: #6cc0ee; --cream: #fff4dc; --cream-2: #e9dcc0;
  --green: #3fbf5a; --red: #d23a2a; --blue: #2565ae;
  --f-title: "Rye", "Rockwell Extra Bold", Georgia, serif;
  --f-num: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --gut: 14px; --rad: 14px;
  --shadow: 0 4px 0 rgba(0,0,0,.45), 0 10px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--diesel); color: var(--cream); font-family: var(--f-body); overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#game { position: absolute; inset: 0; touch-action: none; background: #6cc0ee; }
#game canvas { display: block; touch-action: none; }
.hidden { display: none !important; }
.ico { width: 1.2em; height: 1.2em; flex: none; vertical-align: -0.2em; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3b2414, #17140f 70%); transition: opacity .5s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .load-logo { font-family: var(--f-title); font-size: clamp(34px, 9vw, 72px); color: var(--fair); text-shadow: 0 4px 0 var(--flame-2), 0 8px 18px #000; text-align: center; line-height: 1; }
#loading .load-bar { width: 180px; height: 8px; margin: 18px auto 0; border-radius: 8px; background: #000; overflow: hidden; }
#loading .load-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--flame), var(--fair)); animation: ld 1s ease-in-out infinite alternate; border-radius: 8px; }
@keyframes ld { to { transform: translateX(150%); } }
.load-msg { max-width: 300px; text-align: center; padding: 20px; }

/* ---------- buttons / chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 10px 18px; border: 0; border-radius: var(--rad);
  background: linear-gradient(180deg, #3d3428, #2a231a); color: var(--cream); font-family: var(--f-num); font-weight: 800; font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.12); cursor: pointer; transition: transform .08s, filter .15s; touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; filter: grayscale(.6); cursor: default; }
.btn.primary { background: linear-gradient(180deg, #ffd23f, #ff9a1a); color: #2a1606; box-shadow: 0 4px 0 #a54b0c, 0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.danger { background: linear-gradient(180deg, #e0503e, #a92a1f); }
.btn.danger.confirm { animation: pulse .6s infinite alternate; }
.btn.small { min-height: 48px; font-size: 17px; padding: 8px 14px; }
.btn.icon { width: 52px; padding: 0; }
.btn .bl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
.btn .bl small { font-family: var(--f-body); font-weight: 600; font-size: 12px; letter-spacing: 0; text-transform: none; opacity: .75; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,244,220,.18); font-family: var(--f-num); font-weight: 700; font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
.chip.cash { color: #9df07a; } .chip.lvl { color: var(--fair); }
.chipbtn { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid rgba(255,244,220,.15); background: rgba(0,0,0,.35); font-family: var(--f-num); font-weight: 700; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chipbtn.on { border-color: var(--fair); background: rgba(255,210,63,.15); color: var(--fair); }
.chipbtn.locked { opacity: .5; }
.chipbtn.livery i { width: 20px; height: 20px; border-radius: 6px; border: 3px solid; }

/* ---------- screens ---------- */
#screens { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#screens.on { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: none; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(var(--st) + 10px) calc(var(--sr) + var(--gut)) calc(var(--sb) + 14px) calc(var(--sl) + var(--gut)); }
.screen.on { display: block; animation: scrIn .25s ease-out; }
@keyframes scrIn { from { opacity: 0; transform: translateY(8px); } }
.screen:not([data-screen="menu"]):not([data-screen="pause"]) { background: linear-gradient(180deg, rgba(23,20,15,.92), rgba(34,22,12,.94)); }
.scr-head { position: sticky; top: calc(-10px - var(--st)); z-index: 2; display: flex; align-items: center; gap: 12px; padding: 6px 0 10px; background: linear-gradient(180deg, rgba(23,20,15,1) 70%, rgba(23,20,15,0)); }
.scr-head h2 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 28px; color: var(--fair); text-shadow: 0 3px 0 #7a2a0a; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scr-head .chips { display: flex; gap: 6px; }
.scr-body { max-width: 980px; margin: 0 auto; padding-bottom: 80px; }
h3 { font-family: var(--f-num); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--flame); margin: 18px 0 8px; font-size: 17px; }
.desc { color: var(--cream-2); margin: 8px 2px 0; font-size: 15px; line-height: 1.35; }
.muted { color: rgba(255,244,220,.55); } .small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.center { justify-content: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin: 4px 0 6px; } .tabs.scroll { overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1; min-height: 48px; border: 0; border-radius: 12px; background: rgba(0,0,0,.4); font-family: var(--f-num); font-weight: 800; font-size: 18px; letter-spacing: .05em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; padding: 0 14px; }
.tab.on { background: var(--fair); color: #2a1606; }
.grid { display: grid; gap: 10px; }
.cls-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card.cls { padding: 8px 10px; min-height: 56px; } .card.cls b { font-size: 17px; } .card.cls small { font-size: 12px; } .card.cls .cico { width: 26px; height: 26px; }
.veh-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.shop-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { position: relative; display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; min-height: 64px; border-radius: var(--rad); border: 2px solid rgba(255,244,220,.1); background: linear-gradient(180deg, #2f281f, #221d16); cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.card.sel { border-color: var(--fair); box-shadow: 0 0 0 2px rgba(255,210,63,.25), 0 3px 0 rgba(0,0,0,.4); }
.card.locked, .card.empty { opacity: .55; }
.card .ct { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.card b { font-family: var(--f-num); font-size: 19px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; }
.card small { color: var(--cream-2); font-size: 13px; }
.card .cico { width: 34px; height: 34px; color: var(--fair); }
.card .tag { position: static; margin-top: 2px; font-style: normal; font-family: var(--f-num); font-size: 12px; font-weight: 700; color: var(--fair); letter-spacing: .06em; }
.card .tag.lock { color: var(--flame); }
.card .specs { display: flex; gap: 8px; font-family: var(--f-num); font-size: 14px; color: var(--sky); }
.card .swatch { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; flex: none; box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
.card .swatch span { background: var(--cream); color: var(--diesel); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 900; font-size: 16px; }
.card.shop { flex-direction: column; align-items: stretch; cursor: default; }
.card.shop .sicon { width: 100%; height: 72px; border-radius: 10px; }
.diff { display: flex; gap: 3px; margin-top: 3px; } .diff i { width: 14px; height: 5px; border-radius: 3px; background: rgba(255,244,220,.15); } .diff i.on { background: var(--flame); }
.list { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--rad); background: rgba(0,0,0,.3); border: 1px solid rgba(255,244,220,.08); }
.lrow .lt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lrow b { font-family: var(--f-num); font-size: 18px; font-weight: 800; } .lrow small { color: var(--cream-2); font-size: 13px; }
.lrow .dot, .en-who .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgba(0,0,0,.4); }
.lvl { display: flex; gap: 4px; margin-top: 4px; } .lvl i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255,244,220,.15); } .lvl i.on { background: var(--green); }
.toggle { width: 64px; height: 36px; border-radius: 99px; border: 0; background: #4a4036; position: relative; cursor: pointer; flex: none; margin: 6px 0; }
.toggle i { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--cream); transition: left .15s; }
.toggle.on { background: var(--green); } .toggle.on i { left: 32px; }
.seg { display: flex; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,244,220,.15); }
.seg button { min-height: 44px; min-width: 58px; border: 0; background: transparent; font-family: var(--f-num); font-weight: 800; cursor: pointer; }
.seg button.on { background: var(--fair); color: #2a1606; }
input[type=range] { width: 160px; accent-color: var(--flame); height: 40px; }
.sticky-go { position: sticky; bottom: 0; padding: 14px 0 4px; display: flex; justify-content: center; background: linear-gradient(0deg, rgba(23,20,15,.95) 60%, rgba(23,20,15,0)); }
.btn.go { min-width: min(360px, 100%); min-height: 60px; font-size: 24px; }
.lastres { background: rgba(255,210,63,.1); border-left: 4px solid var(--fair); padding: 8px 12px; border-radius: 8px; }
.garage-detail { margin-top: 12px; } .gd-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .gd-head h3 { flex: 1; margin: 8px 0; color: var(--cream); font-size: 18px; letter-spacing: .03em; min-width: 180px; }

/* panels (results, pause, event) */
.panel { max-width: 640px; margin: 4vh auto 0; padding: 18px; border-radius: 20px; background: linear-gradient(180deg, rgba(47,40,31,.97), rgba(23,20,15,.97)); border: 2px solid rgba(255,210,63,.25); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.panel.narrow { max-width: 360px; } .panel.center { text-align: center; }
.panel h2.big { font-family: var(--f-title); font-weight: 400; color: var(--fair); text-align: center; font-size: 34px; margin: 4px 0 12px; text-shadow: 0 3px 0 #7a2a0a; }
.stackb { display: flex; flex-direction: column; gap: 10px; }
.btnrow { margin-top: 14px; gap: 10px; }
.res-top { text-align: center; } .res-top small { color: var(--cream-2); font-size: 14px; }
.res-dist { font-family: var(--f-num); font-weight: 900; font-size: clamp(56px, 13vw, 96px); line-height: .95; color: var(--fair); text-shadow: 0 5px 0 #a54b0c, 0 10px 30px rgba(255,106,26,.4); }
.res-dist span { font-size: .4em; color: var(--cream); text-shadow: none; }
.res-reason { font-family: var(--f-num); font-size: 20px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); }
.results.full .res-dist { animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.05); filter: brightness(1.2); } }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.statgrid div { background: rgba(0,0,0,.35); border-radius: 12px; padding: 8px; text-align: center; display: flex; flex-direction: column; }
.statgrid small { font-size: 12px; color: var(--cream-2); text-transform: uppercase; letter-spacing: .06em; } .statgrid b { font-family: var(--f-num); font-size: 20px; }
.rewards { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; } .rewards .chip { font-size: 18px; padding: 6px 14px; }
.en-top { text-align: center; } .en-top small { color: var(--cream-2); }
.en-who { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; } .en-who b { font-family: var(--f-num); font-size: 24px; display: block; } .en-who small { color: var(--cream-2); }
ol.stand { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ol.stand li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.3); font-family: var(--f-num); font-size: 18px; }
ol.stand li.me { background: rgba(255,210,63,.18); outline: 1px solid var(--fair); }
ol.stand .pos { width: 26px; height: 26px; border-radius: 50%; background: var(--flame); color: #2a1606; display: grid; place-items: center; font-weight: 900; flex: none; }
ol.stand .nm { flex: 1; font-weight: 700; } ol.stand .ds { font-weight: 800; color: var(--fair); } ol.stand em { font-style: normal; font-size: 12px; background: var(--green); color: #082; color: #04210c; padding: 1px 5px; border-radius: 4px; }
ol.stand .pay { color: #9df07a; }
.pod { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 8px 0; }
.pod .step { width: 30%; max-width: 160px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.pod .step b { font-family: var(--f-num); font-size: 17px; } .pod .step small { color: var(--fair); font-family: var(--f-num); }
.pod .blk { margin-top: 4px; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, #ffd23f, #c98a12); color: #2a1606; font-family: var(--f-title); font-size: 30px; display: grid; place-items: center; }
.pod .s1 .blk { height: 90px; } .pod .s2 .blk { height: 64px; background: linear-gradient(180deg, #e8e8e8, #9aa3ab); } .pod .s3 .blk { height: 46px; background: linear-gradient(180deg, #e0905a, #9a5a2a); }
.pod .step.me b { color: var(--fair); }

/* ---------- main menu ---------- */
.menu-wrap { display: flex; min-height: 100%; }
.menu-col { width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; padding: 8px 4px; }
.menu-right { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; }
.logo { text-align: left; margin-bottom: 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.logo-top { font-family: var(--f-num); font-weight: 800; letter-spacing: .3em; color: var(--cream); font-size: 14px; }
.logo-main { font-family: var(--f-title); font-size: 58px; line-height: .9; color: var(--fair); text-shadow: 0 4px 0 #b8322a, 0 7px 0 #17140f; }
.logo-main span { color: var(--flame); margin-left: 10px; }
.logo-sub { font-family: var(--f-num); font-weight: 700; letter-spacing: .12em; color: var(--sky); text-transform: uppercase; font-size: 14px; }
.menu-btns { display: flex; flex-direction: column; gap: 8px; }
.menu-btns .btn { justify-content: flex-start; width: 100%; }
.menu-btns .btn.primary { min-height: 62px; font-size: 24px; }
.menu-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
[data-screen="menu"] { background: linear-gradient(90deg, rgba(23,20,15,.85) 0%, rgba(23,20,15,.55) 34%, rgba(23,20,15,0) 55%); }
.rotate-tip { display: none; font-size: 13px; background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 99px; margin: 8px; }
html.portrait .rotate-tip { display: inline-flex; gap: 6px; align-items: center; }
html.portrait [data-screen="menu"] { background: linear-gradient(180deg, rgba(23,20,15,.15) 0%, rgba(23,20,15,.65) 38%, rgba(23,20,15,.92) 60%); }
html.portrait .menu-wrap { flex-direction: column-reverse; justify-content: flex-end; }
html.portrait .menu-col { width: 100%; margin: 30vh auto 0; max-width: 420px; }
html.portrait .menu-right { justify-content: center; position: absolute; top: calc(var(--st) + 6px); left: 0; right: 0; }

/* ---------- overlays ---------- */
#banner { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 30; pointer-events: none; text-align: center; transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .2s; white-space: nowrap; }
#banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner .bt { font-family: var(--f-title); font-size: clamp(40px, 9vw, 84px); color: var(--fair); text-shadow: 0 5px 0 #b8322a, 0 9px 0 #17140f, 0 14px 30px rgba(0,0,0,.6); line-height: 1; }
#banner.full .bt { color: #fff; text-shadow: 0 5px 0 var(--flame), 0 9px 0 #b8322a, 0 0 40px var(--fair); animation: pulse .35s infinite alternate; }
#banner.bad .bt { color: #ff8a7a; }
#banner .bs { font-family: var(--f-num); font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: var(--cream); text-shadow: 0 2px 6px #000; margin-top: 6px; }
#announcer { position: absolute; z-index: 25; left: calc(var(--sl) + 12px); top: calc(var(--st) + 10px); max-width: min(30vw, 300px); font-size: 14px !important; display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
  background: var(--cream); color: var(--diesel); padding: 8px 12px; border-radius: 14px 14px 14px 4px; font-weight: 700; font-size: 15px; line-height: 1.25; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(-10px); transition: opacity .2s, transform .2s; }
#announcer.on { opacity: 1; transform: none; }
#announcer b { color: var(--red); } #announcer .ico { width: 18px; height: 18px; }
#pops { position: absolute; left: 50%; top: 44%; z-index: 26; pointer-events: none; }
.pop { position: absolute; left: 0; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-num); font-weight: 900; font-size: 30px; letter-spacing: .04em; color: var(--cream); text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); animation: popUp 1.3s ease-out forwards; }
.pop.good { color: #8dff6a; } .pop.bad { color: #ff8a7a; }
@keyframes popUp { 0% { transform: translate(-50%, 10px) scale(.6); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -50px) scale(1); opacity: 0; } }
#toasts { position: absolute; z-index: 40; left: 50%; bottom: calc(var(--sb) + 16px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(23,20,15,.95); border: 1px solid rgba(255,244,220,.2); padding: 8px 14px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); transition: opacity .4s; white-space: nowrap; }
.toast.good { border-color: var(--green); } .toast.bad { border-color: var(--red); } .toast.out { opacity: 0; }
#fps { position: absolute; z-index: 50; right: calc(var(--sr) + 70px); top: calc(var(--st) + 6px); font: 600 11px/1 monospace; background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 6px; pointer-events: none; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; font-family: var(--f-num); }
.hud-top { position: absolute; top: calc(var(--st) + 6px); left: 50%; transform: translateX(-50%); width: min(44vw, 380px); text-align: center; }
#h-dist .lbl { font-size: 12px; font-weight: 800; letter-spacing: .25em; color: var(--flame); text-shadow: 0 1px 2px #000; }
#h-dist .val { font-weight: 900; font-size: clamp(40px, 8vh, 62px); line-height: .9; color: var(--fair); text-shadow: 0 3px 0 #7a2a0a, 0 0 16px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
#h-dist .val small { font-size: .4em; color: var(--cream); text-shadow: 0 2px 0 #000; }
#h-bar { position: relative; height: 8px; border-radius: 6px; background: rgba(0,0,0,.55); margin-top: 4px; box-shadow: inset 0 0 0 1px rgba(255,244,220,.2); }
#h-prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--flame), var(--fair)); }
