<title>Bounce Blast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one full-screen canvas, overlay screens floating on top. Single neon-night look. */
:root{
  --sky:#140b2e; --sky2:#2a1260; --ink:#fff7e8; --sun:#ffcf3f; --pop:#ff4fa3; --mint:#3ff0c0; --dim:#a99bd6;
  --display:'Bungee',Impact,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{display:block;width:100%;height:100%}

/* HUD: score + coins row, then a row for feature buttons (pause etc.). Effects icons are drawn on the canvas at the left of row 2. */
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hudrow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:22px;text-shadow:0 3px 0 #0008}
.hud .c{color:var(--sun)}
.hudbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;pointer-events:none}
.hbtn{pointer-events:auto;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:#ffffff1f;color:var(--ink);box-shadow:0 4px 0 #0007}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}

/* Screens: every overlay (core + features) is a .screen inside #screens. */
#screens{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:#140b2ecc;text-align:center;pointer-events:auto;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
/* zero-size spacers centre the content, but let tall screens scroll from the top */
.screen::before,.screen::after{content:'';flex:0 0 0px}
.screen::before{margin-top:auto}
.screen::after{margin-bottom:auto}
.scroll{overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h1{font-family:var(--display);font-size:clamp(40px,13vw,72px);line-height:.95;margin:0;color:var(--sun);text-shadow:0 5px 0 var(--pop),0 10px 20px #0009;text-wrap:balance}
h2{font-family:var(--display);margin:0;font-size:34px;color:var(--pop)}
p{margin:0;color:var(--dim);font-size:16px;max-width:30ch}
.big{font-family:var(--display);font-size:40px;color:var(--ink)}
button{font-family:var(--display);font-size:22px;border:0;border-radius:18px;padding:14px 34px;min-height:44px;background:var(--sun);color:var(--sky);box-shadow:0 6px 0 #b8860b;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
button.alt{background:var(--mint);box-shadow:0 6px 0 #1a9474;font-size:18px;padding:10px 24px}
button.alt:active{box-shadow:0 2px 0 #1a9474}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stats{display:flex;gap:18px;font-weight:900;font-size:16px}
.stats b{color:var(--sun)}
.extras{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;max-width:340px}
.extras:empty{display:none}

/* Shop */
.tabs{display:flex;gap:8px}
.tab{font-size:15px;padding:10px 14px;background:#ffffff14;color:var(--ink);box-shadow:0 4px 0 #0006;border-radius:14px}
.tab:active{box-shadow:0 1px 0 #0006}
.tab.on{background:var(--pop);color:var(--ink);box-shadow:0 4px 0 #a02a68}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,92px));gap:10px;max-height:min(46vh,360px);padding:4px}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;background:#ffffff14;border-radius:14px;padding:10px 4px;font-size:13px;font-weight:900;color:var(--ink);box-shadow:none;font-family:var(--body);line-height:1.2}
.skin:active{box-shadow:none}
.skin .dot{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 6px}
.skin .dot.none{border:2px dashed var(--dim)}
.skin canvas.dot{width:44px;height:44px;border-radius:0;margin:-5px auto 1px}
.skin .st{color:var(--dim)}
.skin.on{outline:3px solid var(--sun)}
.skin.on .st{color:var(--sun)}

.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:26px;color:var(--mint);pointer-events:none;text-shadow:0 3px 0 #0008;white-space:nowrap}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="hudrow" id="hudRow"><span id="score">0</span><span class="c">&#9679; <span id="coinsHud">0</span></span></div>
    <div class="hudbtns" id="hudBtns"></div>
  </div>

  <div id="screens">
    <div class="screen" id="menu">
      <h1>BOUNCE<br>BLAST</h1>
      <p>Hold the left or right side of the screen to steer. Bounce as high as you can!</p>
      <div class="stats"><span>Best <b id="best">0</b></span><span>Coins <b id="coins">0</b></span></div>
      <button id="play">PLAY</button>
      <button class="alt" id="shopBtn">SHOP</button>
      <div class="extras" id="menuExtras"></div>
    </div>

    <div class="screen" id="shop" hidden>
      <h2>SHOP</h2>
      <p id="shopMsg">Collect coins while you play to unlock cool stuff.</p>
      <div class="tabs" id="shopTabs" role="tablist">
        <button class="tab on" data-tab="skins" role="tab">Skins</button>
        <button class="tab" data-tab="trails" role="tab">Trails</button>
        <button class="tab" data-tab="hats" role="tab">Hats</button>
      </div>
      <div class="skins scroll" id="skins"></div>
      <button class="alt" id="back">BACK</button>
    </div>

    <div class="screen" id="over" hidden>
      <h2>OUCH!</h2>
      <div class="big" id="final">0</div>
      <p id="overMsg"></p>
      <div class="extras" id="overExtras"></div>
      <button id="again">PLAY AGAIN</button>
      <button class="alt" id="home">MENU</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="core.js"></script>
<script src="features/platforms.js"></script>
<script src="features/enemies.js"></script>
<script src="features/powerups.js"></script>
<script src="features/meta.js"></script>
<script src="features/worlds.js"></script>
<script src="main.js"></script>
