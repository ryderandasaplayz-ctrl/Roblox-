<title>Bounce Blast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one full-screen canvas, overlay menus floating on top. Single neon-night look. */
:root{
  --sky:#140b2e; --sky2:#2a1260; --ink:#fff7e8; --sun:#ffcf3f; --pop:#ff4fa3; --mint:#3ff0c0; --dim:#a99bd6;
  --display:'Bungee',Impact,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;pointer-events:none;text-shadow:0 3px 0 #0008}
.hud .c{color:var(--sun)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#140b2ecc;text-align:center}
h1{font-family:var(--display);font-size:clamp(40px,13vw,72px);line-height:.95;margin:0;color:var(--sun);text-shadow:0 5px 0 var(--pop),0 10px 20px #0009;text-wrap:balance}
h2{font-family:var(--display);margin:0;font-size:34px;color:var(--pop)}
p{margin:0;color:var(--dim);font-size:16px;max-width:30ch}
.big{font-family:var(--display);font-size:40px;color:var(--ink)}
button{font-family:var(--display);font-size:22px;border:0;border-radius:18px;padding:14px 34px;background:var(--sun);color:var(--sky);box-shadow:0 6px 0 #b8860b;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
button.alt{background:var(--mint);box-shadow:0 6px 0 #1a9474;font-size:18px;padding:10px 24px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stats{display:flex;gap:18px;font-weight:900;font-size:16px}
.stats b{color:var(--sun)}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,92px));gap:10px}
.skin{background:#ffffff14;border-radius:14px;padding:10px 4px;font-size:13px;font-weight:900;color:var(--ink);box-shadow:none;font-family:var(--body)}
.skin .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 6px}
.skin.on{outline:3px solid var(--sun)}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:26px;color:var(--mint);pointer-events:none;text-shadow:0 3px 0 #0008;white-space:nowrap}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="hud" hidden><span id="score">0</span><span class="c">● <span id="coinsHud">0</span></span></div>
  <div class="toast" id="toast" hidden></div>

  <div class="screen" id="menu">
    <h1>BOUNCE<br>BLAST</h1>
    <p>Hold the left or right side of the screen to steer. Bounce as high as you can!</p>
    <div class="stats"><span>Best <b id="best">0</b></span><span>Coins <b id="coins">0</b></span></div>
    <button id="play">PLAY</button>
    <button class="alt" id="shopBtn">SKINS</button>
  </div>

  <div class="screen" id="shop" hidden>
    <h2>SKINS</h2>
    <p>Collect coins while you play to unlock new bouncers.</p>
    <div class="skins" id="skins"></div>
    <button class="alt" id="back">BACK</button>
  </div>

  <div class="screen" id="over" hidden>
    <h2>OUCH!</h2>
    <div class="big" id="final">0</div>
    <p id="overMsg"></p>
    <button id="again">PLAY AGAIN</button>
    <button class="alt" id="home">MENU</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ---------- save data
const SKINS=[
  {name:'Sunny',color:'#ffcf3f',price:0},{name:'Bubblegum',color:'#ff4fa3',price:50},{name:'Mint',color:'#3ff0c0',price:100},
  {name:'Lava',color:'#ff5a1f',price:200},{name:'Ice',color:'#8fd8ff',price:300},{name:'Rainbow',color:'rainbow',price:600}];
let save={best:0,coins:0,owned:[0],skin:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('bounceblast')||'{}'))}catch(e){}
function store(){try{localStorage.setItem('bounceblast',JSON.stringify(save))}catch(e){}}

// ---------- sound
let ac=null;
function beep(f,d=.08,type='square',v=.06,slide=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,ac.currentTime+d);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

// ---------- input
let left=false,right=false;
const touches=new Map();
function updTouch(){left=right=false;for(const x of touches.values()){if(x<W/2)left=true;else right=true}}
cv.addEventListener('pointerdown',e=>{touches.set(e.pointerId,e.clientX);updTouch()});
cv.addEventListener('pointermove',e=>{if(touches.has(e.pointerId)){touches.set(e.pointerId,e.clientX);updTouch()}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,e=>{touches.delete(e.pointerId);updTouch()}));
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});

// ---------- game state
let G=null,running=false;
const GRAV=1500,JUMP=-780;

function newGame(){
  G={p:{x:W/2,y:H-120,vx:0,vy:JUMP,r:16,squash:1,jet:0,shield:0,magnet:0},
     cam:0,maxH:0,coins:0,plats:[],items:[],enemies:[],parts:[],stars:[],topY:H,combo:0,shake:0,t:0};
  for(let i=0;i<60;i++)G.stars.push({x:Math.random(),y:Math.random(),s:Math.random()*2+.5});
  G.plats.push({x:W/2-40,y:H-60,w:80,type:'normal'});
  while(G.topY>-H)spawnRow();
}

function difficulty(){return Math.min(1,G.maxH/12000)}
function spawnRow(){
  const d=difficulty();
  G.topY-=60+Math.random()*(40+d*60);
  const w=Math.max(50,80-d*25);
  const r=Math.random();
  let type='normal';
  if(r<.12+d*.15)type='moving';else if(r<.22+d*.2)type='break';else if(r<.28)type='spring';
  const pl={x:Math.random()*(W-w),y:G.topY,w,type,dir:Math.random()<.5?1:-1,speed:60+d*120};
  G.plats.push(pl);
  // breakable rows also get a real platform so there's always a way up
  if(type==='break')G.plats.push({x:Math.random()*(W-w),y:G.topY-30,w,type:'normal'});
  const q=Math.random();
  if(q<.35)G.items.push({x:pl.x+pl.w/2,y:pl.y-30,type:'coin'});
  else if(q<.38)G.items.push({x:pl.x+pl.w/2,y:pl.y-34,type:'jet'});
  else if(q<.41)G.items.push({x:pl.x+pl.w/2,y:pl.y-34,type:'shield'});
  else if(q<.44)G.items.push({x:pl.x+pl.w/2,y:pl.y-34,type:'magnet'});
  if(G.maxH>1500&&Math.random()<.04+d*.08)G.enemies.push({x:Math.random()*W,y:G.topY-40,bx:0,t:Math.random()*6,r:18});
}

function burst(x,y,col,n=12,sp=220){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,col})}}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,1100)}
function skinColor(t){const s=SKINS[save.skin].color;return s==='rainbow'?`hsl(${(t*200)%360},90%,60%)`:s}

function update(dt){
  const p=G.p;G.t+=dt;
  const L=left||keys.ArrowLeft||keys.a,R=right||keys.ArrowRight||keys.d;
  const acc=2400;
  if(L)p.vx-=acc*dt;if(R)p.vx+=acc*dt;
  if(!L&&!R)p.vx*=Math.pow(.02,dt);
  p.vx=Math.max(-420,Math.min(420,p.vx));
  if(p.jet>0){p.jet-=dt;p.vy=-950;if(Math.random()<.8)G.parts.push({x:p.x,y:p.y+p.r,vx:(Math.random()-.5)*80,vy:300,life:.4,col:'#ff8a3d'})}
  else p.vy+=GRAV*dt;
  p.shield=Math.max(0,p.shield-dt);p.magnet=Math.max(0,p.magnet-dt);
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;
  p.squash+=(1-p.squash)*Math.min(1,dt*12);

  // platforms
  for(const pl of G.plats){
    if(pl.type==='moving'){pl.x+=pl.dir*pl.speed*dt;if(pl.x<0||pl.x+pl.w>W)pl.dir*=-1}
    if(pl.falling){pl.vy=(pl.vy||0)+GRAV*dt;pl.y+=pl.vy*dt;continue}
    if(p.vy>0&&p.jet<=0&&p.x>pl.x-p.r*.6&&p.x<pl.x+pl.w+p.r*.6&&p.y+p.r>pl.y&&p.y+p.r-p.vy*dt<=pl.y+6){
      if(pl.type==='break'){pl.falling=true;burst(pl.x+pl.w/2,pl.y,'#c58b5a',8);beep(160,.12,'sawtooth',.05,.5);continue}
      p.y=pl.y-p.r;p.vy=pl.type==='spring'?JUMP*1.7:JUMP;p.squash=.6;
      if(pl.type==='spring'){beep(300,.3,'sine',.08,3);burst(p.x,p.y+p.r,'#3ff0c0',14);toast('BOING!')}
      else beep(420+Math.min(G.combo,10)*30,.08,'square',.04,1.6);
    }
  }
  // items
  for(const it of G.items){
    if(it.got)continue;
    if(p.magnet>0&&it.type==='coin'){const dx=p.x-it.x,dy=p.y-it.y,dd=Math.hypot(dx,dy);if(dd<220){it.x+=dx/dd*600*dt;it.y+=dy/dd*600*dt}}
    if(Math.hypot(p.x-it.x,p.y-it.y)<p.r+14){
      it.got=true;
      if(it.type==='coin'){G.coins++;beep(988,.06,'square',.04);setTimeout(()=>beep(1318,.1,'square',.04),60);burst(it.x,it.y,'#ffcf3f',6,120)}
      if(it.type==='jet'){p.jet=2.5;toast('JETPACK!');beep(200,.5,'sawtooth',.06,4)}
      if(it.type==='shield'){p.shield=8;toast('SHIELD!');beep(600,.3,'sine',.08,2)}
      if(it.type==='magnet'){p.magnet=8;toast('COIN MAGNET!');beep(500,.3,'triangle',.08,2)}
    }
  }
  // enemies
  for(const e of G.enemies){
    if(e.dead){e.y+=400*dt;continue}
    e.t+=dt;e.x+=Math.sin(e.t*2)*90*dt;
    if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){
      if(p.vy>0&&p.y<e.y-4||p.jet>0||p.shield>0){
        e.dead=true;p.vy=JUMP*1.1;G.shake=8;G.coins+=3;burst(e.x,e.y,'#ff4fa3',20);beep(120,.25,'square',.08,.3);toast('STOMP! +3');
      }else return die();
    }
  }
  // particles
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.life-=dt}
  G.parts=G.parts.filter(q=>q.life>0);

  // camera
  const target=p.y-H*.42;
  if(target<G.cam)G.cam=target;
  const h=Math.floor(-(p.y-(H-120))/10);
  if(h>G.maxH)G.maxH=h;
  while(G.topY>G.cam-200)spawnRow();
  const cut=G.cam+H+100;
  G.plats=G.plats.filter(o=>o.y<cut);G.items=G.items.filter(o=>o.y<cut&&!o.got);G.enemies=G.enemies.filter(o=>o.y<cut);
  G.shake*=.9;
  if(p.y-G.cam>H+60)die();
  $('score').textContent=G.maxH;$('coinsHud').textContent=G.coins;
}

function die(){
  running=false;beep(400,.6,'sawtooth',.08,.2);
  save.coins+=G.coins;const nb=G.maxH>save.best;if(nb)save.best=G.maxH;store();
  $('final').textContent=G.maxH;
  $('overMsg').textContent=(nb?'NEW BEST! ':'Best '+save.best+'. ')+'You grabbed '+G.coins+' coins.';
  $('hud').hidden=true;$('over').hidden=false;
}

// ---------- draw
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  const k=G?Math.min(1,G.maxH/8000):0;
  g.addColorStop(0,`hsl(${260-k*60},60%,${8+k*4}%)`);g.addColorStop(1,`hsl(${280-k*80},55%,${20-k*6}%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!G)return;
  for(const s of G.stars){const y=((s.y*H-G.cam*.1*s.s)%H+H)%H;ctx.fillStyle=`rgba(255,247,232,${.3+s.s*.2})`;ctx.fillRect(s.x*W,y,s.s,s.s)}
  ctx.save();
  ctx.translate((Math.random()-.5)*G.shake,-G.cam+(Math.random()-.5)*G.shake);
  for(const pl of G.plats){
    const col={normal:'#3ff0c0',moving:'#8fd8ff',break:'#c58b5a',spring:'#3ff0c0'}[pl.type];
    ctx.fillStyle=col;rr(pl.x,pl.y,pl.w,12,6);
    if(pl.type==='break'){ctx.strokeStyle='#5a3a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pl.x+pl.w*.4,pl.y);ctx.lineTo(pl.x+pl.w*.5,pl.y+12);ctx.lineTo(pl.x+pl.w*.6,pl.y);ctx.stroke()}
    if(pl.type==='spring'){ctx.fillStyle='#ff4fa3';rr(pl.x+pl.w/2-10,pl.y-10,20,10,3)}
  }
  for(const it of G.items){
    const bob=Math.sin(G.t*4+it.x)*3;
    if(it.type==='coin'){const sx=Math.abs(Math.cos(G.t*4+it.x));ctx.fillStyle='#ffcf3f';ctx.beginPath();ctx.ellipse(it.x,it.y+bob,9*sx+1,9,0,0,7);ctx.fill()}
    else{const c={jet:'#ff8a3d',shield:'#8fd8ff',magnet:'#ff4fa3'}[it.type];ctx.fillStyle=c;ctx.beginPath();ctx.arc(it.x,it.y+bob,14,0,7);ctx.fill();
      ctx.fillStyle='#140b2e';ctx.font='900 14px Nunito';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({jet:'J',shield:'S',magnet:'M'}[it.type],it.x,it.y+bob+1)}
  }
  for(const e of G.enemies){
    ctx.fillStyle='#ff4fa3';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
    const f=Math.sin(G.t*20)*8;ctx.beginPath();ctx.moveTo(e.x-e.r,e.y);ctx.lineTo(e.x-e.r-14,e.y-6+f);ctx.lineTo(e.x-e.r+2,e.y+8);ctx.moveTo(e.x+e.r,e.y);ctx.lineTo(e.x+e.r+14,e.y-6+f);ctx.lineTo(e.x+e.r-2,e.y+8);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-6,e.y-3,5,0,7);ctx.arc(e.x+6,e.y-3,5,0,7);ctx.fill();
    ctx.fillStyle='#140b2e';ctx.beginPath();ctx.arc(e.x-6,e.y-2,2.5,0,7);ctx.arc(e.x+6,e.y-2,2.5,0,7);ctx.fill();
  }
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,q.life/.6);ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,4,4)}
  ctx.globalAlpha=1;
  const p=G.p;
  if(p.shield>0){ctx.strokeStyle=`rgba(143,216,255,${p.shield<2?(Math.sin(G.t*20)>0?.9:.2):.8})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r+8,0,7);ctx.stroke()}
  ctx.save();ctx.translate(p.x,p.y+p.r);ctx.scale(2-p.squash,p.squash);
  ctx.fillStyle=skinColor(G.t);ctx.beginPath();ctx.arc(0,-p.r,p.r,0,7);ctx.fill();
  const look=Math.max(-4,Math.min(4,p.vx/80));
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6+look,-p.r-3,5,0,7);ctx.arc(6+look,-p.r-3,5,0,7);ctx.fill();
  ctx.fillStyle='#140b2e';ctx.beginPath();ctx.arc(-6+look*1.4,-p.r-3+(p.vy>0?1.5:-1.5),2.5,0,7);ctx.arc(6+look*1.4,-p.r-3+(p.vy>0?1.5:-1.5),2.5,0,7);ctx.fill();
  ctx.restore();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(running)update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- menus
function refreshMenu(){$('best').textContent=save.best;$('coins').textContent=save.coins}
function start(){newGame();running=true;['menu','over','shop'].forEach(i=>$(i).hidden=true);$('hud').hidden=false;beep(523,.1);setTimeout(()=>beep(784,.15),100)}
function renderShop(){
  const box=$('skins');box.innerHTML='';
  SKINS.forEach((s,i)=>{
    const b=document.createElement('button');b.className='skin'+(save.skin===i?' on':'');
    const own=save.owned.includes(i);
    const bg=s.color==='rainbow'?'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)':s.color;
    b.innerHTML=`<div class="dot" style="background:${bg}"></div>${s.name}<br>${own?(save.skin===i?'Equipped':'Equip'):'● '+s.price}`;
    b.onclick=()=>{
      if(own){save.skin=i}
      else if(save.coins>=s.price){save.coins-=s.price;save.owned.push(i);save.skin=i;beep(880,.2,'sine',.08,2)}
      else{beep(150,.15,'square',.05);b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],200);return}
      store();renderShop();
    };
    box.appendChild(b);
  });
  $('shop').querySelector('p').textContent='You have '+save.coins+' coins. Collect more while you play!';
}
$('play').onclick=start;$('again').onclick=start;
$('home').onclick=()=>{$('over').hidden=true;$('menu').hidden=false;refreshMenu()};
$('shopBtn').onclick=()=>{$('menu').hidden=true;$('shop').hidden=false;renderShop()};
$('back').onclick=()=>{$('shop').hidden=true;$('menu').hidden=false;refreshMenu()};
refreshMenu();
// demo bounce behind the menu
newGame();
requestAnimationFrame(loop);
</script>
