<title>Saturday Gridiron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  /* Layout: full-bleed pixel field canvas; LED scoreboard pinned top, play-call rail pinned bottom;
     menus are scoreboard panels stacked in one centered column over the panning stadium. */
  --night:#0c1220; --panel:#141d33; --panel2:#1c2848; --line:#2c3c66; --ink:#f2ecdc; --dim:#a3b0cf;
  --led:#ffc94a; --amber:#ffb627; --amber-dk:#9c6a00; --good:#56d46e; --bad:#ff6262; --info:#6cc6ff;
  --teal:#2fae9f; --teal-dk:#1b6f66; --black:#05070c;
  --display:'Silkscreen','Courier New',monospace;
  --body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--info);outline-offset:2px}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:0;min-height:46px;padding:12px 18px;
  background:var(--amber);color:#1b1305;clip-path:var(--notch);box-shadow:inset 0 -4px 0 var(--amber-dk);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--amber-dk)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -4px 0 #0008}
.btn.teal{background:var(--teal);color:#04120f;box-shadow:inset 0 -4px 0 var(--teal-dk)}
.btn.danger{background:var(--bad);color:#200404;box-shadow:inset 0 -4px 0 #8a1f1f}
.btn.sm{font-size:12px;min-height:40px;padding:8px 12px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

/* ---------- scoreboard HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sb{flex:1 1 auto;max-width:540px;min-width:0;display:grid;grid-template-columns:1fr auto 1fr;background:#06080ee8;border:2px solid #000;box-shadow:0 0 0 2px var(--line)}
.sb-t{display:flex;align-items:center;gap:6px;padding:4px 8px;min-width:0}
.sb-t.opp{flex-direction:row-reverse}
.sb-ab{font-family:var(--display);font-size:13px;padding:2px 5px;line-height:1;border-bottom:3px solid}
.sb-pts{font-family:var(--display);font-size:24px;color:var(--led);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center;line-height:1}
.sb-pos{width:0;height:0;border:5px solid transparent;border-left-color:var(--led);visibility:hidden}
.sb-t.opp .sb-pos{border-left-color:transparent;border-right-color:var(--led)}
.sb-t.has .sb-pos{visibility:visible}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 10px;background:#0d1322;border-left:2px solid #000;border-right:2px solid #000}
.sb-q{font-family:var(--display);font-size:10px;color:var(--dim);letter-spacing:.08em}
.sb-clock{font-family:var(--display);font-size:18px;color:var(--led);font-variant-numeric:tabular-nums;line-height:1.1}
.sb-dd{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-top:2px solid #000;background:#101727;font-family:var(--display);font-size:11px;letter-spacing:.04em}
.sb-dd span:first-child{color:var(--led)}
.hbtn{pointer-events:auto;flex:0 0 auto;width:44px;height:44px;border:0;background:#06080ee8;color:var(--ink);font-family:var(--display);font-size:14px;box-shadow:0 0 0 2px var(--line);border:2px solid #000}

/* ---------- play-call rail ---------- */
#ctl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#0c1220f5 65%,#0c122000);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ctl-in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:6px}
.play{font-family:var(--display);font-size:12px;line-height:1.1;text-transform:uppercase;border:0;background:var(--panel2);color:var(--ink);padding:7px 5px;min-height:50px;
  clip-path:var(--notch);box-shadow:inset 0 -3px 0 #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.play small{font-family:var(--body);font-size:11px;text-transform:none;color:var(--dim);letter-spacing:0}
.play.on{background:var(--ink);color:#121212}
.play.on small{color:#4a4a4a}
.play.sp{background:var(--teal-dk)}
.play.sp small{color:#c9efe9}
.play.snap{background:var(--amber);color:#1b1305;box-shadow:inset 0 -3px 0 var(--amber-dk);font-size:15px}
.play.snap small{color:#4b3400}
.play:active{transform:translateY(2px)}

#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;
  font-size:14px;background:#000b;padding:6px 12px;color:var(--ink);pointer-events:none;text-align:center;transition:opacity .6s}
#hint.fade{opacity:0}
#toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--display);font-size:13px;background:#000c;padding:6px 12px;color:var(--ink);
  pointer-events:none;white-space:nowrap;letter-spacing:.04em}
#kickHud{position:absolute;left:0;right:0;top:calc(100px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px;text-align:center}
#kickHud b{font-family:var(--display);font-size:18px;color:var(--led);text-shadow:2px 2px 0 #000}
#kickHud span{font-size:15px;background:#000b;padding:4px 10px}

#banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px;text-align:center}
#banner b{font-family:var(--display);font-weight:700;font-size:clamp(26px,7.5vw,46px);line-height:1.05;color:#fff;text-shadow:3px 3px 0 #000;background:var(--bk,#1c2848);padding:6px 18px;box-shadow:0 0 0 3px #000}
#banner span{font-size:17px;background:#000c;padding:3px 10px}
#banner.pop b{animation:pop .32s steps(4) both}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* ---------- in-game card ---------- */
#card{position:absolute;inset:0;display:grid;place-items:center;background:#04070dbb;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cardbox{width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 10px 0 #0007;padding:18px;display:flex;flex-direction:column;gap:10px}
.cardbox h3{font-family:var(--display);font-size:13px;color:var(--dim);margin:0;letter-spacing:.08em;text-transform:uppercase}
.cardbox .big{font-family:var(--display);font-size:26px;color:var(--led);line-height:1.1;text-wrap:balance}
.cardbox .ln{font-size:17px;line-height:1.35;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.cardbox .ln.show{opacity:1;transform:none}
.cardbox .ln:last-of-type.k-good{color:var(--good)}
.cardbox .ln:last-of-type.k-bad{color:var(--bad)}
.cardbox .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cardbox .acts .btn{flex:1 1 140px}

/* ---------- menu screens ---------- */
#scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:rgba(9,14,26,.86);touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scr.clear{background:rgba(9,14,26,.55)}
.page{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:12px}
.bar h2{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.04em;text-wrap:balance;min-width:0}
.bar .grow{flex:1}
h2,h3,h4{text-wrap:balance}
.panel{background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--line);padding:14px}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .led{color:var(--led)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.stars{color:var(--led);letter-spacing:1px;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.helm{display:block;flex:0 0 auto}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* title */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9}
.logo .l1{font-family:var(--display);font-size:clamp(20px,6vw,34px);color:var(--led);letter-spacing:.3em;margin-right:-.3em}
.logo .l2{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,104px);color:var(--ink);text-shadow:4px 4px 0 #b4421e,8px 8px 0 #000}
.tag{margin:0;font-size:18px;color:var(--ink);max-width:34ch}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.fine{font-size:13px;color:var(--dim);max-width:40ch;margin:0}
.save-pill{font-size:14px;color:var(--dim)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{font-family:var(--display);font-size:12px;border:0;background:var(--panel2);color:var(--dim);padding:9px 11px;min-height:40px;white-space:nowrap;clip-path:var(--notch)}
.tab.on{background:var(--ink);color:#121212}

/* team list */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.trow{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--panel);padding:10px;box-shadow:0 0 0 2px var(--line);min-height:60px}
.trow.on{box-shadow:0 0 0 2px var(--led)}
.trow b{font-family:var(--display);font-size:13px;display:block}
.trow span{font-size:14px;color:var(--dim)}
.pick-detail{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font-family:var(--body);font-size:18px;background:var(--black);color:var(--ink);border:2px solid var(--line);padding:10px;min-height:46px;user-select:text;-webkit-user-select:text;width:100%}

/* hub */
.band{display:flex;align-items:center;gap:14px;padding:14px;border:2px solid #000;box-shadow:0 0 0 2px var(--line);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--tc2)}
.band h2{font-family:var(--display);font-size:clamp(18px,4.5vw,26px);margin:0;line-height:1.05}
.band .meta{font-size:15px;opacity:.9}
.band .rk{font-family:var(--display);font-size:28px;margin-left:auto;text-align:right;line-height:1}
.band .rk small{display:block;font-size:10px;letter-spacing:.1em;opacity:.8}
.statline{display:flex;flex-wrap:wrap;gap:8px 18px}
.statline div{display:flex;flex-direction:column}
.statline b{font-family:var(--display);font-size:18px;color:var(--led)}
.meter{height:10px;background:var(--black);border:2px solid #000;box-shadow:0 0 0 1px var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.next{display:flex;flex-direction:column;gap:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side b{font-family:var(--display);font-size:14px}
.vs .at{font-family:var(--display);font-size:13px;color:var(--dim)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-variant-numeric:tabular-nums;align-items:center}
.cmp .c{font-family:var(--display);font-size:11px;color:var(--dim);text-align:center}
.cmp .a{text-align:right;font-family:var(--display)} .cmp .b{text-align:left;font-family:var(--display)}
.navg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{font-family:var(--display);font-size:10px;letter-spacing:.08em;color:var(--dim);text-align:left;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 6px;border-bottom:1px solid #ffffff10;white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.me td{background:#ffc94a1f}
.tbl .tn{display:flex;align-items:center;gap:8px}

/* roster */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;background:var(--panel);padding:8px 10px;box-shadow:0 0 0 2px var(--line);text-align:left;border:0;width:100%}
.prow .pos{font-family:var(--display);font-size:12px;color:var(--dim)}
.prow .ovr{font-family:var(--display);font-size:20px;color:var(--led);min-width:2.2ch;text-align:right}
.prow .nm{font-size:16px}
.prow .sub{font-size:13px;color:var(--dim)}
.st-tag{font-family:var(--display);font-size:9px;background:var(--teal-dk);color:#fff;padding:1px 4px;margin-left:6px;vertical-align:2px}
.pdetail{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:6px;border-top:1px solid #ffffff14}
.attr{display:flex;flex-direction:column;align-items:center;min-width:42px}
.attr b{font-family:var(--display);font-size:16px}
.attr span{font-family:var(--display);font-size:9px;color:var(--dim);letter-spacing:.08em}

/* results */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.gm{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.gm .ln2{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.gm .ln2 b{font-family:var(--display);font-size:14px}
.gm .ln2.w{color:var(--ink)} .gm .ln2.l{color:var(--dim)}
.gm.mine{box-shadow:0 0 0 2px var(--led)}
.final{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.final .sc{font-family:var(--display);font-size:clamp(36px,10vw,60px);color:var(--led);line-height:1}
.final .tm{display:flex;flex-direction:column;align-items:center;gap:6px}
.final .tm b{font-family:var(--display);font-size:14px}
.verdict{font-family:var(--display);font-size:22px;text-align:center}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:10px}
.bracket .rnd{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.recruit .r-top{display:flex;align-items:center;gap:10px}
.recruit .acts2{display:flex;gap:6px;flex-wrap:wrap}
.interest{height:8px;background:var(--black);position:relative;flex:1;min-width:60px}
.interest i{position:absolute;left:0;top:0;bottom:0;background:var(--info)}
.pip{display:inline-block;width:12px;height:12px;background:var(--black);box-shadow:0 0 0 1px var(--line);margin-right:3px}
.pip.on{background:var(--led)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .tab{flex:1 1 auto}
.how h3{font-family:var(--display);font-size:14px;margin:0;color:var(--led);letter-spacing:.06em}
.how p{margin:0;line-height:1.45;max-width:65ch}
.how .panel{display:flex;flex-direction:column;gap:8px}
@media (max-width:520px){.bracket{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#banner.pop b{animation:none}.cardbox .ln{transition:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Football field"></canvas>
  <div id="hud" hidden>
    <div class="sb">
      <div class="sb-t" id="hudMe"><span class="sb-ab"></span><span class="sb-pts">0</span><span class="sb-pos"></span></div>
      <div class="sb-mid"><span class="sb-q" id="hudQ">Q1</span><span class="sb-clock" id="hudClock">10:00</span></div>
      <div class="sb-t opp" id="hudOpp"><span class="sb-ab"></span><span class="sb-pts">0</span><span class="sb-pos"></span></div>
      <div class="sb-dd"><span id="hudDown">1st &amp; 10</span><span id="hudSpot">Own 25</span></div>
    </div>
    <button class="hbtn" id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <div id="kickHud" hidden></div>
  <div id="banner" hidden><b></b><span></span></div>
  <div id="toast" hidden></div>
  <div id="hint" hidden></div>
  <div id="ctl" hidden><div class="ctl-in" id="ctlIn"></div></div>
  <div id="card" hidden></div>
  <div id="scr" hidden></div>
</div>

<script src="data.js"></script>
<script src="league.js"></script>
<script src="field.js"></script>
<script src="match.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
