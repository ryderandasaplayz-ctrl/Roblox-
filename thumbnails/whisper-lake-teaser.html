<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,HZ=640;
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const c=document.getElementById('c'),x=c.getContext('2d');
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return [k,k.getContext('2d')]};
function noise1(n){let v=0,a=1,f=1;for(let o=0;o<5;o++){v+=a*Math.sin(n*f*0.004+o*13.7)*Math.cos(n*f*0.0027+o*3.1);a*=.5;f*=2.1}return v}
// ---------- above-water scene ----------
const [S,s]=mk();
let g=s.createLinearGradient(0,0,0,HZ);
g.addColorStop(0,'#04060f');g.addColorStop(.45,'#101a33');g.addColorStop(.8,'#3a2a45');g.addColorStop(1,'#a8542a');
s.fillStyle=g;s.fillRect(0,0,W,HZ);
for(let i=0;i<500;i++){const y=R()*HZ*.7;s.fillStyle=`rgba(255,255,255,${R()*.7*(1-y/(HZ*.7))})`;s.fillRect(R()*W,y,R()<.1?2:1,R()<.1?2:1)}
const MX=1380,MY=230;
g=s.createRadialGradient(MX,MY,60,MX,MY,520);g.addColorStop(0,'rgba(255,230,180,.55)');g.addColorStop(.3,'rgba(255,170,90,.18)');g.addColorStop(1,'rgba(0,0,0,0)');
s.fillStyle=g;s.fillRect(0,0,W,H);
g=s.createRadialGradient(MX-25,MY-25,10,MX,MY,110);g.addColorStop(0,'#fff8e6');g.addColorStop(.85,'#f3d9a4');g.addColorStop(1,'#d9b27a');
s.fillStyle=g;s.beginPath();s.arc(MX,MY,110,0,7);s.fill();
for(let i=0;i<40;i++){const a=R()*7,r=R()*90;s.fillStyle=`rgba(150,120,80,${R()*.15})`;s.beginPath();s.arc(MX+Math.cos(a)*r,MY+Math.sin(a)*r,5+R()*22,0,7);s.fill()}
// clouds
for(let i=0;i<260;i++){const cx=R()*W,cy=120+R()*330,r=40+R()*130,d=Math.hypot(cx-MX,cy-MY);
 const lit=Math.max(0,1-d/700);g=s.createRadialGradient(cx,cy,0,cx,cy,r);
 g.addColorStop(0,`rgba(${40+lit*180|0},${40+lit*130|0},${60+lit*90|0},${.10+lit*.06})`);g.addColorStop(1,'rgba(0,0,0,0)');
 s.fillStyle=g;s.fillRect(cx-r,cy-r,2*r,2*r)}
g=s.createRadialGradient(MX,MY,0,MX,MY,160);g.addColorStop(0,'rgba(255,245,215,.85)');g.addColorStop(.7,'rgba(255,230,180,.35)');g.addColorStop(1,'rgba(0,0,0,0)');s.fillStyle=g;s.fillRect(MX-160,MY-160,320,320);
// mountains
function ridge(base,amp,col,off){s.fillStyle=col;s.beginPath();s.moveTo(0,HZ);for(let i=0;i<=W;i+=4)s.lineTo(i,base-amp*(.6+noise1(i+off)*.6));s.lineTo(W,HZ);s.fill()}
ridge(560,140,'#2b2a42',100);ridge(600,90,'#211f33',900);
// pine trees
function pine(px,py,h,col){s.fillStyle=col;s.beginPath();s.moveTo(px,py-h);const L=Math.max(6,h/7|0);
 for(let i=1;i<=L;i++){const t=i/L,w=h*.28*t*(.8+R()*.4),y=py-h+h*t;s.lineTo(px+w,y);s.lineTo(px+w*.35,y-h*.03)}
 for(let i=L;i>=1;i--){const t=i/L,w=h*.28*t*(.8+R()*.4),y=py-h+h*t;s.lineTo(px-w*.35,y-h*.03);s.lineTo(px-w,y)}
 s.closePath();s.fill();s.fillRect(px-h*.015,py-h*.05,h*.03,h*.08)}
const layers=[[610,60,'#1b1a2b',9],[625,95,'#13121f',13],[640,150,'#0b0a12',20]];
for(const [y,h,col,step] of layers){for(let i=-20;i<W+20;i+=step+R()*step){if(i>1000&&i<1250&&h>100&&R()<.8)continue;pine(i,y+R()*8,h*(.6+R()*.8),col)}
 g=s.createLinearGradient(0,y-h,0,y);g.addColorStop(0,'rgba(120,110,150,0)');g.addColorStop(1,'rgba(120,110,150,.12)');s.fillStyle=g;s.fillRect(0,y-h*1.5,W,h*1.5)}
// cabin with lit window on far shore
s.fillStyle='#07060b';s.fillRect(1120,600,90,42);s.beginPath();s.moveTo(1110,602);s.lineTo(1165,565);s.lineTo(1220,602);s.fill();
s.fillStyle='#ffb453';s.fillRect(1140,612,14,12);s.fillRect(1178,612,14,12);
g=s.createRadialGradient(1165,618,0,1165,618,90);g.addColorStop(0,'rgba(255,170,80,.35)');g.addColorStop(1,'rgba(0,0,0,0)');s.fillStyle=g;s.fillRect(1050,520,230,200);
// ghost elk on far shore
function elk(t,ox,oy,sc){t.save();t.translate(ox,oy);t.scale(sc,sc);
 t.beginPath();t.ellipse(0,-105,98,38,0,0,7);t.fill();
t.beginPath();t.moveTo(70,-130);t.quadraticCurveTo(105,-150,118,-178);t.lineTo(145,-178);t.lineTo(172,-160);t.lineTo(165,-148);t.lineTo(138,-150);t.quadraticCurveTo(120,-110,95,-85);t.fill();
for(const [lx,a] of [[-80,-.05],[-60,.06],[55,-.04],[78,.05]]){t.beginPath();t.moveTo(lx-9,-90);t.lineTo(lx+9,-90);t.lineTo(lx+5+a*60,0);t.lineTo(lx-3+a*60,0);t.fill()}
t.lineWidth=7;t.lineCap='round';t.beginPath();
for(const d of[0,14]){const bx=128+d,by=-176;t.moveTo(bx,by);t.bezierCurveTo(bx-10,by-60,bx-60,by-90,bx-95,by-120);
 t.moveTo(bx-6,by-30);t.lineTo(bx+22,by-55);t.moveTo(bx-25,by-70);t.lineTo(bx+5,by-105);t.moveTo(bx-55,by-95);t.lineTo(bx-40,by-140);t.moveTo(bx-80,by-112);t.lineTo(bx-75,by-150)}
t.stroke();t.restore()}
s.save();s.shadowColor='rgba(140,255,230,.9)';s.shadowBlur=40;s.fillStyle='rgba(190,255,240,.55)';s.strokeStyle='rgba(190,255,240,.6)';elk(s,1560,640,.75);s.restore();
s.fillStyle='rgba(230,255,250,.35)';s.strokeStyle='rgba(230,255,250,.35)';elk(s,1560,640,.75);
s.fillStyle='#ff3b3b';s.beginPath();s.arc(1560+150*.75,640-160*.75,3,0,7);s.fill();
x.drawImage(S,0,0);
// ---------- lake reflection ----------
g=x.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#1a1828');g.addColorStop(1,'#030308');x.fillStyle=g;x.fillRect(0,HZ,W,H-HZ);
for(let y=HZ;y<H;y+=2){const src=2*HZ-y;if(src<0)break;const k=(y-HZ)/(H-HZ),off=Math.sin(y*.12)*(1+k*6)+Math.sin(y*.031)*k*5;
 x.globalAlpha=.75-k*.35;x.drawImage(S,0,src,W,2,off,y,W,2)}
x.globalAlpha=1;
for(let i=0;i<220;i++){const y=HZ+8+Math.pow(R(),1.5)*(H-HZ),w=6+R()*60*(1+(y-HZ)/150),cx=MX+(R()-.5)*(30+(y-HZ)*.5);
 x.fillStyle=`rgba(255,225,170,${.15+R()*.4})`;x.fillRect(cx-w/2,y,w,1.5)}
for(let i=0;i<400;i++){const y=HZ+R()*(H-HZ);x.fillStyle=`rgba(200,200,255,${R()*.06})`;x.fillRect(R()*W,y,20+R()*120,1)}
// mist
for(let i=0;i<180;i++){const cx=R()*W,cy=HZ-30+R()*120,r=60+R()*160;g=x.createRadialGradient(cx,cy,0,cx,cy,r);
 g.addColorStop(0,'rgba(170,165,200,.07)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r)}
// ---------- foreground shore, dock, hunter ----------
x.fillStyle='#030305';x.beginPath();x.moveTo(0,860);for(let i=0;i<=760;i+=10)x.lineTo(i,880+noise1(i*3)*20+i*.12);x.lineTo(760,H);x.lineTo(0,H);x.fill();
for(let i=0;i<900;i++){const bx=R()*780,by=870+R()*210+bx*.1,h=10+R()*45;x.strokeStyle=`rgba(${8+R()*15},${8+R()*12},${10+R()*15},1)`;x.lineWidth=1.5;x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+(R()-.5)*10,by-h/2,bx+(R()-.5)*20,by-h);x.stroke()}
// big framing pine left & right
s.clearRect(0,0,W,H);pine(70,1100,900,'#020203');pine(1880,1100,820,'#020203');x.drawImage(S,0,0);
// dock
x.fillStyle='#0d0a08';x.beginPath();x.moveTo(540,925);x.lineTo(900,880);x.lineTo(905,892);x.lineTo(545,940);x.fill();x.strokeStyle='#050404';x.lineWidth=2;for(let i=0;i<14;i++){const px=560+i*25;x.beginPath();x.moveTo(px,923-i*3.1);x.lineTo(px+2,936-i*3.1);x.stroke()}
for(const px of[600,700,800,880])x.fillRect(px,925-(px-540)*.125,8,80);
// pumpkins
function jack(px,py,r){let g2=x.createRadialGradient(px,py,0,px,py,r*5);g2.addColorStop(0,'rgba(255,140,40,.35)');g2.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g2;x.fillRect(px-r*5,py-r*5,r*10,r*10);
 g2=x.createRadialGradient(px-r*.3,py-r*.3,r*.1,px,py,r*1.2);g2.addColorStop(0,'#c8621c');g2.addColorStop(1,'#4a1a05');x.fillStyle=g2;x.beginPath();x.ellipse(px,py,r*1.15,r*.9,0,0,7);x.fill();
 x.fillStyle='#ffd27a';x.shadowColor='#ffae3a';x.shadowBlur=12;x.beginPath();x.moveTo(px-r*.55,py-r*.1);x.lineTo(px-r*.3,py-r*.45);x.lineTo(px-r*.1,py-r*.1);x.moveTo(px+r*.1,py-r*.1);x.lineTo(px+r*.3,py-r*.45);x.lineTo(px+r*.55,py-r*.1);x.fill();
 x.beginPath();x.moveTo(px-r*.65,py+r*.15);for(let k=0;k<=6;k++)x.lineTo(px-r*.65+k*r*.22,py+r*.15+(k%2?r*.2:0));x.quadraticCurveTo(px,py+r*.8,px-r*.65,py+r*.15);x.fill();x.shadowBlur=0;
 x.fillStyle='#1e2a10';x.fillRect(px-r*.1,py-r*1.1,r*.2,r*.3)}
jack(250,960,34);jack(330,985,24);jack(870,890,20);
// hunter silhouette (from behind) with lantern
x.save();x.translate(470,905);x.fillStyle='#010102';
x.beginPath();x.ellipse(0,-200,22,26,0,0,7);x.fill();
x.beginPath();x.ellipse(0,-218,46,8,0,0,7);x.fill();x.beginPath();x.moveTo(-22,-220);x.quadraticCurveTo(-20,-252,0,-250);x.quadraticCurveTo(20,-252,22,-220);x.fill();
x.fillRect(-12,-178,24,12);
x.beginPath();x.moveTo(-40,-170);x.quadraticCurveTo(0,-182,40,-170);x.quadraticCurveTo(50,-120,44,-60);x.lineTo(-44,-60);x.quadraticCurveTo(-50,-120,-40,-170);x.fill();
x.beginPath();x.moveTo(-34,-64);x.lineTo(-6,-64);x.lineTo(-10,0);x.lineTo(-30,0);x.fill();x.beginPath();x.moveTo(6,-64);x.lineTo(34,-64);x.lineTo(30,0);x.lineTo(10,0);x.fill();
x.beginPath();x.ellipse(-22,0,20,7,0,0,7);x.fill();x.beginPath();x.ellipse(22,0,20,7,0,0,7);x.fill();
x.beginPath();x.moveTo(36,-165);x.quadraticCurveTo(54,-130,48,-95);x.lineTo(36,-95);x.quadraticCurveTo(38,-130,28,-150);x.fill();
x.beginPath();x.moveTo(-36,-165);x.quadraticCurveTo(-62,-120,-66,-80);x.lineTo(-54,-76);x.quadraticCurveTo(-48,-120,-28,-150);x.fill();
x.save();x.translate(30,-150);x.rotate(-1.25);x.fillRect(-60,-6,200,6);x.fillRect(-70,-8,50,12);x.fillRect(20,-14,40,7);x.restore();
x.restore();
const LX=408,LY=840;g=x.createRadialGradient(LX,LY,0,LX,LY,260);g.addColorStop(0,'rgba(255,190,100,.55)');g.addColorStop(.3,'rgba(255,140,60,.15)');g.addColorStop(1,'rgba(0,0,0,0)');
x.fillStyle=g;x.fillRect(LX-260,LY-260,520,520);x.fillStyle='#ffe2a8';x.shadowColor='#ffb34d';x.shadowBlur=30;x.fillRect(LX-8,LY-12,16,22);x.shadowBlur=0;x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(LX-10,LY-14,20,26);
// rim light on hunter edge
x.strokeStyle='rgba(255,170,90,.35)';x.lineWidth=2;x.beginPath();x.moveTo(415,870);x.lineTo(425,830);x.stroke();
g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=g;x.fillRect(0,0,W,H);
// floating glowing question marks
for(const [qx,qy,sz,rot] of [[1000,580,170,-.15],[1240,480,120,.18],[870,450,85,.1],[1720,340,95,-.2]]){
 x.save();x.translate(qx,qy);x.rotate(rot);x.font=`900 ${sz}px "DejaVu Serif", serif`;x.textAlign='center';
 x.shadowColor='rgba(140,255,225,1)';x.shadowBlur=50;x.fillStyle='rgba(200,255,240,.85)';x.fillText('?',0,0);x.shadowBlur=15;x.fillText('?',0,0);x.restore()}
x.textAlign='center';
x.font='900 128px "DejaVu Serif", Georgia, serif';
x.save();x.shadowColor='rgba(120,255,220,.8)';x.shadowBlur=45;x.fillStyle='rgba(0,0,0,.01)';x.fillText('WHISPER LAKE',660,190);x.restore();
x.lineWidth=14;x.strokeStyle='#05040a';x.strokeText('WHISPER LAKE',660,190);
g=x.createLinearGradient(0,70,0,190);g.addColorStop(0,'#f4fffb');g.addColorStop(.6,'#b8f5e6');g.addColorStop(1,'#5fcfb4');x.fillStyle=g;x.fillText('WHISPER LAKE',660,190);
x.font='900 76px "DejaVu Sans", Arial, sans-serif';x.lineWidth=12;x.strokeText('SOMETHING IS COMING...',660,295);
g=x.createLinearGradient(0,235,0,300);g.addColorStop(0,'#ffd36b');g.addColorStop(1,'#ff6a00');x.fillStyle=g;x.fillText('SOMETHING IS COMING...',660,295);
x.font='700 44px "DejaVu Sans", Arial, sans-serif';x.lineWidth=9;
x.strokeText('NEW ??? • NEW ??? • NEW ???',660,365);x.fillStyle='#fff';x.fillText('NEW ??? • NEW ??? • NEW ???',660,365);
x.font='900 66px "DejaVu Sans", Arial, sans-serif';x.lineWidth=12;x.strokeText('NEXT WEEKEND',1560,1015);
x.fillStyle='#ffd36b';x.shadowColor='rgba(255,140,40,.8)';x.shadowBlur=25;x.fillText('NEXT WEEKEND',1560,1015);x.shadowBlur=0;
// grain
const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0);
</script></body></html>
